syntax = "proto3";

package game.v1;

option go_package = "github.com/jeanluca/w2pp-openwyd/api/game/v1;gamev1";

// GameControlService is the tmServer's inbound control surface: the first one it
// has ever had. Until now the game server only listened on the client port, so
// nothing could ask it who was playing or tell it to do anything.
//
// It exists for the admin panel. Every call is a moderator action the panel has
// already authorized against account.role and recorded in its audit log — the
// tmServer has no database of its own and cannot re-check either, which is why
// the listener refuses to start without a shared token and treats whoever
// presents it as the panel.
//
// Every RPC crosses into the single-owner game loop through World.GoDetached and
// waits for the loop to answer. That queue is drained ahead of player input, so
// these calls must stay one-shot: a screen that polled this on a timer would
// front-run gameplay.
service GameControlService {
  // ListOnline returns the sessions the server currently holds.
  rpc ListOnline(ListOnlineRequest) returns (ListOnlineResponse);
  // Kick ends every session of one account, whatever screen it is on.
  rpc Kick(KickRequest) returns (KickResponse);
  // Broadcast sends a notice to everyone in play.
  rpc Broadcast(BroadcastRequest) returns (BroadcastResponse);
  // Unstuck moves a character out of somewhere it cannot walk out of.
  //
  // The world has spots that let a player in and not back out — a gap in the
  // collision map, a warp that lands inside scenery. Reconnecting does not help:
  // the position is saved, so the player comes back exactly where they were
  // stuck. Until now the only remedy was editing the database by hand, which
  // needs the character offline and somebody willing to do it.
  rpc Unstuck(UnstuckRequest) returns (UnstuckResponse);
  // DeliverNow empties an account mailbox without waiting for its next login.
  //
  // delivery_queue is drained once, at account login, straight into the
  // warehouse. That is right for the donate shop and wrong for support: a
  // player who reports a problem and gets an item handed to them is told to log
  // out and back in, which is the moment they find out the panel cannot
  // actually give them anything while they are standing there.
  //
  // Nothing new is granted here. It is the same mailbox and the same placement
  // the login path runs — only sooner.
  rpc DeliverNow(DeliverNowRequest) returns (DeliverNowResponse);
  // SettleRmtSaleNow takes a sold real-money item out of a seller's warehouse
  // while they are standing in the game, instead of at their next login.
  //
  // The escrow mark makes the item inert — it cannot be moved, changed, refined
  // or sold — so removing it late is not a risk. It is a DISCOMFORT: the seller
  // sees an item that is no longer theirs, already paid for and already
  // delivered to the buyer, sitting in their warehouse. They count their items,
  // conclude something is wrong, and open a ticket about a system that is
  // working.
  //
  // Nothing new is decided here and no money moves. The sale was settled when
  // the payment was confirmed; this only runs the removal that the login path
  // already runs, sooner. An account that is not connected is not a failure:
  // its next login does the same work.
  rpc SettleRmtSaleNow(SettleRmtSaleNowRequest) returns (SettleRmtSaleNowResponse);
  // Overlays reports which moderator-editing overlays this server booted with.
  //
  // Each is a boot flag that defaults to OFF. While one is off, the panel's
  // matching editor still writes to the database and the game never reads it —
  // the edit sits there inert forever with nothing on any screen to say so, and
  // the moderator concludes the feature is broken or that they did it wrong.
  //
  // The panel cannot work this out on its own: the flags live in the game
  // server's environment, and the database looks identical either way. So the
  // game says.
  rpc Overlays(OverlaysRequest) returns (OverlaysResponse);

  // Drain empties the server and waits for every save to land.
  //
  // It exists because a restart is only safe if the saves finish, and on
  // shutdown they compete with the platform's SIGTERM-to-SIGKILL window: the
  // server announces, then saves every player one at a time, and whatever has
  // not finished when the kill lands is lost — items, experience, gold since
  // login. Ending the sessions first does the same saving with no deadline
  // attached, and the shutdown that follows finds an empty world.
  rpc Drain(DrainRequest) returns (DrainResponse);

  // ListBlocks finds NPCGener blocks — by number, by leader template name, or
  // near a tile — with how many of their mobs are alive right now and whether
  // the block is switched off. The panel's "Blocos" page.
  rpc ListBlocks(ListBlocksRequest) returns (ListBlocksResponse);
  // BlockCommand runs one of the in-game block commands (npc off|on, gerar,
  // criar, matar, recarregar) as a GM standing at (x, y) would, and returns
  // the lines the GM would have read. Same code as "/gm", so the two cannot
  // drift apart.
  rpc BlockCommand(BlockCommandRequest) returns (BlockCommandResponse);
  // ListMarket returns every open stall shelf, as the game holds it right now.
  //
  // IT HAS TO COME FROM HERE, and that is the whole reason this RPC exists: a
  // personal shop lives only in the seller's SESSION, in the game's memory. It is
  // never written to the database, so no amount of reading the database finds it.
  //
  // It answers from inside the single-owner loop, like every other call here.
  rpc ListMarket(ListMarketRequest) returns (ListMarketResponse);
  // SetPassLevel changes the battle-pass frame of an account that is PLAYING, and
  // redraws it for everybody who can see them.
  //
  // IT DOES NOT WRITE THE DATABASE. The level lives on the account row, and the
  // caller has already written it there — this is the courtesy that spares the
  // player a relog, exactly like DeliverNow. A failure here loses nothing: the
  // stored level applies at the next login.
  //
  // found=false means the account is not connected. That is the ordinary answer,
  // not an error: most accounts are offline most of the time.
  rpc SetPassLevel(SetPassLevelRequest) returns (SetPassLevelResponse);
}

message SetPassLevelRequest {
  string account_name = 1;
  // 0 = no pass, 1..4 = the four frames. Out of range is refused: the byte goes
  // straight onto the wire, and a number the client cannot draw would show up as
  // something else entirely.
  int32 level = 2;
}

message SetPassLevelResponse {
  // Whether the account was connected and got the new frame now.
  bool found = 1;
  // The character standing in the world, when there is one, so the panel can say
  // "Fulana viu a moldura mudar".
  string character_name = 2;
}

message ListMarketRequest {}

// MarketOffer is one item on one shelf.
//
// THIS IS THE INTERNAL SHAPE, and it carries the seller's ACCOUNT id, which the
// public page must never see. The web-api uses it to ask the database whether that
// shelf already has somebody paying, and drops it before answering the site.
message MarketOffer {
  // Who is selling, for the caller's own lookups. NOT for showing.
  int64 seller_account_id = 1;
  // Which Cargo slot the item is offered from. With the account id it names the
  // listing row, which is how the caller finds an open charge.
  int32 cargo_pos = 2;

  // The seller's CHARACTER name, which is what a player sees in game and the only
  // name that may be shown.
  string seller_character = 3;
  int32 item_index = 4;
  int32 refine = 5;
  int32 amount = 6;
  // 0 gold, 1 cash, 2 real money. The price is in that currency's own unit —
  // cents for real money.
  int32 currency = 7;
  int64 price = 8;
  // The city the stall stands in, written out ("Armia"), and EMPTY outside a city.
  //
  // The NAME and not the index, because the list of names would then exist in two
  // places — here and in whoever shows it — and the two would disagree the day
  // somebody adds a city. The game owns the table; it owns the names.
  string village = 9;

  // HOW LONG THE STALL HAS BEEN UP, IN SECONDS, and not the instant it went up.
  //
  // The stall's clock is the game loop's tick counter, not a wall clock: turning
  // it into a date would produce a wrong date the first time the server restarts.
  // A duration measured at the moment of the answer needs no clock at all.
  //
  // Whoever caches this answer must remember WHEN it arrived and add the time
  // since, rather than serving this number as it was: a cached duration freezes,
  // and a page that says "up 3 minutes ago" for an hour is lying quietly.
  int64 open_for_seconds = 10;
}

message ListMarketResponse {
  repeated MarketOffer offers = 1;
}

message ListBlocksRequest {
  // Absent = any block. A plain int32 could not say "any": 0 is a real block.
  optional int32 index = 1;
  string name = 2;     // substring of the leader template name, any case
  int32 x = 3;         // with radius > 0: only blocks starting near (x, y)
  int32 y = 4;
  int32 radius = 5;
  int32 limit = 6;     // 0 = the server's cap
}

message ListBlocksResponse {
  repeated Block blocks = 1;
  int32 total = 2;     // how many matched before the limit
}

// Block is one NPCGener block as the game holds it right now.
message Block {
  int32 index = 1;     // position in NPCGener.txt (Entity.GenIndex)
  string name = 2;     // leader template
  int32 x = 3;         // start waypoint
  int32 y = 4;
  int32 alive = 5;
  int32 max = 6;
  int32 minute = 7;    // MinuteGenerate; <= 0 means only events raise it in the legacy
  bool off = 8;        // switched off by staff
  bool db_managed = 9; // a merchant of the NPC panel
  bool event_owned = 10;
  bool has_templates = 11;
}

message BlockCommandRequest {
  string line = 1;     // e.g. "npc off 23", "gerar 396 aqui", "matar bloco 396"
  int32 x = 2;         // where "around you" is
  int32 y = 3;
  string by = 4;       // the staff account, for the game's log and the switch row
}

message BlockCommandResponse {
  repeated string lines = 1;
}

message ListOnlineRequest {}

message ListOnlineResponse {
  repeated OnlinePlayer players = 1;
  // in_play counts sessions with a character in the world; connected counts
  // every session the server holds, including the ones still on the character
  // screen. They are different numbers and both have been called "online".
  int32 in_play = 2;
  int32 connected = 3;
}

message OnlinePlayer {
  string account_name = 1;
  string character_name = 2;  // empty while the account is still choosing
  int32 level = 3;
  int32 map_x = 4;
  int32 map_y = 5;
  bool in_play = 6;           // false = connected but not in the world yet
  string ip = 7;
}

message KickRequest {
  // account_name, not character: the panel works in accounts, and a player on
  // the character screen has no character name to match on. Matching by
  // character is how the in-game /gm ban misses anyone who has not entered the
  // world yet.
  string account_name = 1;
}
message KickResponse {
  // sessions is how many were ended. Zero means the account was not connected,
  // which is not an error — it is the answer.
  int32 sessions = 1;
}

message UnstuckRequest {
  // account_name, not character, for the reason KickRequest gives: the panel
  // works in accounts.
  string account_name = 1;

  // to_x/to_y send the character to an EXACT tile instead of the nearest city.
  // Both zero (the default) keeps the rescue behaviour.
  //
  // It exists because the panel had no way to put somebody anywhere: rescuing a
  // stuck player and reaching a place to look at it are the same operation with
  // a different destination, and without this the only way into an area with no
  // entry implemented is to have no way in at all.
  int32 to_x = 2;
  int32 to_y = 3;
}
message UnstuckResponse {
  // found is false when the account is not in the world. That is an answer, not
  // an error: the player may have logged off between the report and the click.
  bool found = 1;
  string character_name = 2;
  int32 from_x = 3;
  int32 from_y = 4;
  int32 to_x = 5;
  int32 to_y = 6;
  // city is the name of where they landed, so the moderator can tell them.
  string city = 7;
}

message DeliverNowRequest {
  string account_name = 1;
}
message DeliverNowResponse {
  // found is false when the account is not connected. Its mailbox keeps the
  // items and the next login drains them, so this is not a failure.
  bool found = 1;
  // delivered and lost split what the mailbox held. lost keeps its name for
  // the wire, but nothing is lost any more: it counts the grants that found no
  // free warehouse slot and stay pending for the next login or deliver-now —
  // the panel has to be able to say so instead of reporting a delivery that
  // did not happen.
  int32 delivered = 2;
  int32 lost = 3;
  string character_name = 4;
}

message SettleRmtSaleNowRequest {
  string account_name = 1;
}
message SettleRmtSaleNowResponse {
  // found is false when the seller is not connected. The mark stays on the
  // slot, the item stays inert, and the next login removes it — so this is not
  // a failure and the panel must not read it as one.
  bool found = 1;
  // removed counts the warehouse slots emptied. Zero with found=true is the
  // ordinary case: nothing was pending.
  int32 removed = 2;
  string character_name = 3;
}

message OverlaysRequest {}
message OverlaysResponse {
  // Each field is one boot flag. The names match the editors they feed rather
  // than the environment variables, because the panel speaks in screens.
  bool item_stats = 1;  // W2PP_ITEM_STAT_EDITING — atributos de item
  bool mob_stats = 2;   // W2PP_MOB_STAT_EDITING  — atributos de monstro
  bool npcs = 3;        // W2PP_NPC_EDITING       — NPCs e suas lojas

  // xp_config_version is the Mesa de XP version this process actually loaded,
  // read once at boot. The Mesa needs no flag — an unedited table IS the legacy
  // behaviour — so the three booleans above cannot answer the only question
  // that matters about it: is what the panel shows what the game is paying?
  //
  // Compared against the version in the database, it separates "saved and live"
  // from "saved, waiting for a restart" — which look identical on the screen
  // and differ by a week of wrong levelling.
  //
  // Zero means the server booted with no Mesa at all: either it has no dbServer
  // or the read failed, and it is running the legacy tables.
  int64 xp_config_version = 4;

  // mount_config_version is when the mount overlay (curves + absorption) last
  // changed, as unix seconds, as this process read it at boot. The panel
  // compares it with the database to tell a saved-and-live screen from one whose
  // save is still waiting for a restart. Zero means it booted without the
  // overlay — no dbServer, or the read failed — and every lineage is on the
  // compiled default.
  int64 mount_config_version = 5;

  // quest_content is what Common/Settings/QuestsRate.txt gave THIS process,
  // captured before the panel's own rows were applied over it.
  //
  // It exists because the panel was showing the wrong baseline. Its "no arquivo"
  // line read domain.QuestRewardDefaults — the numbers compiled into the binary
  // from CReadFiles.cpp — while the content file says something else entirely
  // (30.000 of experience on the Cemitério, not 1.000). Two things went wrong
  // because of it: an edit that looked like quadrupling a reward was really
  // cutting it to a seventh, and "voltar ao valor do conteúdo" would have left
  // the screen showing a number the game does not pay.
  //
  // The panel cannot read the file itself: adminServer is deliberately
  // standalone and mounts no content tree. Asking the running process is also
  // the stronger answer — it reports what is actually loaded, not what a file on
  // some disk happens to say.
  //
  // Empty means the server booted with no content tree (-content unset), so it
  // is running the compiled defaults and the panel should say exactly that.
  repeated QuestContentRate quest_content = 6;
}

// QuestContentRate is one quest trophy as the content file defines it. Arch is
// absent on purpose: these quests are Mortal's alone on this server, so an Arch
// column would be a number nobody can reach.
message QuestContentRate {
  int32 tier = 1;
  int64 mortal_exp = 2;
  int32 coin = 3;
  int32 mortal_min = 4;
  int32 mortal_max = 5;
}

message BroadcastRequest {
  string message = 1;
}
message BroadcastResponse {
  // recipients is how many players in play received it.
  int32 recipients = 1;
}

message DrainRequest {
  // message is announced to everyone before the sessions end. Empty sends
  // nothing, which is right for an emergency and wrong for a planned restart.
  string message = 1;
}
message DrainResponse {
  int32 notified = 1;  // players who received the notice
  int32 kicked = 2;    // sessions ended
}
