syntax = "proto3";

// web-api contract — DESIGNED FROM SCRATCH (web-platform-plan.md). This is the
// edge the Next.js BFF (Route Handlers / Server Actions) calls server-side over
// gRPC + mTLS; the browser never speaks gRPC. It is SEPARATE from the legacy
// CPSock game login and from dbServer's AccountService (api/db/v1), which
// mirrors the legacy G↔DB messages. web-api reuses the same `account` table and
// argon2id hashing underneath, but exposes its own web-facing surface.
//
// Generate with `make proto` (protoc + protoc-gen-go/-grpc).
package web.v1;

option go_package = "github.com/jeanluca/w2pp-openwyd/api/web/v1;webv1";

// AccountWebService owns the web platform's account flows (sign-up, credential
// check for the BFF session cookie). Game state is never written here — that
// stays in tmServer's single-owner loop (web-platform-plan.md).
service AccountWebService {
  // CreateAccount registers a new web/game account (argon2id-hashed password).
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  // VerifyCredentials validates name + password so the BFF can mint a session
  // cookie. It is the web login path, independent of the CPSock game login.
  rpc VerifyCredentials(VerifyCredentialsRequest) returns (VerifyCredentialsResponse);
  // SetMyDiscordLink guarda o Discord da pessoa depois do OAuth do site.
  //
  // UM DISCORD PARA UMA CONTA, garantido por indice UNICO PARCIAL onde o campo
  // nao e vazio -- mais um CHECK proibindo string vazia. Os dois, e nao so o
  // indice: em Postgres NULL nao conflita com NULL, entao sem o CHECK bastaria
  // alguem gravar "" para o indice parar de valer.
  //
  // TROCAR o Discord de uma conta que ja tem OUTRO e RECUSADO, e so a staff
  // desfaz. Sem isso, quem tomasse uma conta trocaria o vinculo em silencio e
  // levaria junto o cargo que o Discord da.
  rpc SetMyDiscordLink(SetMyDiscordLinkRequest) returns (SetMyDiscordLinkResponse);
}

// RmtWebService owns the player-to-player real-money trade surface: today the
// seller's Pix receiving key, later the listing and the charge.
//
// A SERVICE OF ITS OWN, not two more RPCs on AccountWebService, because the two
// carry different weight. AccountWebService is sign-up and login; this one points
// at where real money lands. Keeping them apart means the RMT surface can be
// gated, logged or withdrawn on its own, and it names the subject in the method
// path (/web.v1.RmtWebService/SavePixKey) for anybody reading an access log.
service RmtWebService {
  // SavePixKey stores the account's Pix RECEIVING key — where the money goes
  // when the player sells an item for real money.
  //
  // It REFUSES while a charge is open against any of the seller's listings, and
  // the lock is here rather than in the form: otherwise the script is two clicks
  // long — list an item, wait for the buyer to open the QR code, change the key,
  // and take the payment in a different account. A defence that lives in the
  // screen is not a defence.
  rpc SavePixKey(SavePixKeyRequest) returns (SavePixKeyResponse);
  // GetPixKey returns the key MASKED, never whole: the form only needs to show
  // "you already registered ...1234", and a Pix key is personal payment data on a
  // public site.
  rpc GetPixKey(GetPixKeyRequest) returns (GetPixKeyResponse);
  // DeletePixKey APAGA a chave e o CPF, os dois juntos.
  //
  // OS DOIS JUNTOS porque sao um cadastro so: chave sem documento nao paga, ja
  // que a rota de repasse exige o CPF. Deixar o documento para tras guardaria
  // dado pessoal que nao serve mais para nada -- e dado que nao serve e so o que
  // vaza num incidente.
  //
  // Recusa pelas MESMAS duas travas do SavePixKey, e na mesma ordem: cobranca
  // aberta primeiro, repasse depois. Quando as duas valem, a pessoa le a da
  // venda, que e a que passa sozinha antes.
  //
  // UMA DIFERENCA DELIBERADA em relacao ao SavePixKey: gravar a MESMA chave passa
  // mesmo com repasse a caminho, porque nao desvia nada -- e e o que deixa um
  // vendedor antigo, cadastrado antes de o CPF ser obrigatorio, completar o
  // documento que falta. Apagar nao e gravar a mesma chave: e tira-la, com
  // dinheiro a caminho dela. Entao o apagar confere SEMPRE.
  rpc DeletePixKey(DeletePixKeyRequest) returns (DeletePixKeyResponse);
  // GetMyCurrentPixCharge returns the real-money charge this account has as a
  // BUYER, so the site can show the Pix copy-and-paste code — and so it can say
  // what happened once the charge closes.
  //
  // The buyer clicks buy IN THE GAME, is told to pay on the site, opens their
  // account page and pays there. The game client is not touched: it cannot draw
  // a QR code, open a link, or copy to the clipboard, so the payment screen was
  // never going to live inside it.
  //
  // "CURRENT" AND NOT "OPEN": it also returns a charge that closed a few minutes
  // ago, and that is the whole reason the name is not Open. A page that simply
  // empties out is a page that, as far as the person is concerned, lost their
  // money — and the worst moment for that is the second after they paid. The
  // window is server configuration; past it, the answer is empty.
  //
  // IT CREATES THE PIX CODE, and this is the one write it does. The charge row
  // itself is created by the game when the shelf is bought, WITHOUT a code; the
  // first read of an open charge that has no code yet asks the processor for one,
  // stores it, and returns it. It closes by payment, by the buyer leaving the
  // game, or by its deadline. Nothing here cancels anything.
  //
  // Creating late, rather than at the click in the game, means a buyer who never
  // opens the page costs no processor call — and the game server needs no
  // credentials for the payment path.
  //
  // IDEMPOTENT PER CHARGE, and the caller sees the consequences:
  //
  //   - The site polls every 5 s while a charge is OPEN, so concurrent reads do
  //     arrive together. Only ONE call to the processor may go out per charge, so
  //     the row is locked for the duration of that call and every reader is
  //     answered with the STORED code, never with one a losing racer created.
  //     Two tabs therefore always show the same code.
  //   - While the processor is answering, the read returns OPEN with an EMPTY
  //     pix_code. That is not a failure: it means "being generated", and the next
  //     poll has it. A read that fails to create also returns OPEN with an empty
  //     code rather than an error, because the retry is what fixes it.
  //   - With less than a minute left before expires_at, NOTHING is created and the
  //     state comes back EXPIRED even though the row is still open in the
  //     database. A code with ten seconds of life is a refund waiting to happen:
  //     the person pays, the money lands on a dead charge, and both sides lose.
  //
  // THERE IS NO "GIVE UP" CALL, and leaving it out is a decision: cancelling on
  // our side does NOT cancel the Pix at the processor, so a give-up button would
  // manufacture the PAID_LATE case for anyone who clicks it and then pays anyway
  // with the bank app already open. The deadline already closes the charge on its
  // own.
  //
  // NO CHARGE IS AN EMPTY ANSWER, NOT AN ERROR. It is the ordinary state of
  // almost every account almost all of the time, and the page that asks this is
  // the account page — which people open to look at other things.
  //
  // WHICH ONE IS "CURRENT", when more than one could be:
  //
  //  1. An OPEN charge always wins. It is the only one the person can act on.
  //  2. Otherwise a PAID_LATE whose refund has not finished — and that one does
  //     NOT age out of the page. Somebody's money is sitting still; a page that
  //     forgets it after ten minutes leaves them with nothing to look at and
  //     nobody to ask.
  //  3. Otherwise the most recent charge that closed inside the recent window.
  //
  // A PAID_LATE that is waiting behind an open charge comes back on its own once
  // the open one closes. Nothing is lost, only queued.
  //
  // AT MOST ONE, and that is an invariant of the database rather than a choice
  // made here: one charge open per listing, and a buyer with two open charges
  // could pay twice for one item.
  rpc GetMyCurrentPixCharge(GetMyCurrentPixChargeRequest) returns (GetMyCurrentPixChargeResponse);
  // ListMarketListings is the market as a PUBLIC page: everything on sale in every
  // stall, right now.
  //
  // IT IS NOT A DATABASE READ. A personal shop lives only in the seller's session,
  // in the game server's memory, and is never persisted — so this answer is fetched
  // from the game over the control link and cached for a few seconds, because the
  // page is public and the game must not be asked once per visitor.
  //
  // NOTHING HERE IDENTIFIES AN ACCOUNT. The seller is named by the CHARACTER
  // standing in the stall, which is what any player already sees by walking up to
  // it. The account behind it is not in this contract at all.
  //
  // REAL-MONEY SHELVES WITH SOMEBODY ALREADY PAYING ARE LEFT OUT. While a charge is
  // open the item cannot be bought by anyone else, and the game refuses the second
  // buyer. Listing it would be an invitation to a refusal; leaving it out promises
  // nothing and is the simpler truth. It comes back on its own when the charge
  // closes.
  rpc ListMarketListings(ListMarketListingsRequest) returns (ListMarketListingsResponse);
}

// RmtSystemService is the server-to-server side of real-money selling: the site
// telling the game that the payment processor said something.
//
// A SERVICE OF ITS OWN, and not two more methods on RmtWebService, because the
// CALLER is different in kind. RmtWebService answers a person looking at their
// own account page; this one answers the site's webhook handler, with no person
// behind it. Mixing them would put a payment-notification endpoint behind the key
// a browser-driven request can reach.
//
// It is NOT in servicosDoJogador, and that means the site's player key does not
// open it: the webhook handler holds a separate system key. If a bug in the
// player-facing side ever let somebody call arbitrary web-api methods with the
// site key, this door would still be shut.
//
// NOTHING HERE IS TRUSTED. The notice is a doorbell, not evidence: the server
// answers it by asking the processor what actually happened. A forged or repeated
// notice costs one extra query and nothing else.
service RmtSystemService {
  // NotifySyncpayEvent relays one processor event the site received.
  //
  // The site receives it because the processor's webhook is per ACCOUNT, not per
  // charge: a real-money charge created on the same account as the donation shop
  // announces itself to the site. Rather than the site guessing what to do, it
  // recognizes the event as ours and hands it over.
  rpc NotifySyncpayEvent(NotifySyncpayEventRequest) returns (NotifySyncpayEventResponse);
}

// RankingWebService exposes public ranking projections for the web front-end.
// It reads persisted character state from Postgres; the browser calls the
// Next.js BFF, and the BFF calls this service over gRPC + mTLS.
service RankingWebService {
  // ListExpRanking returns the Top EXP character ranking.
  rpc ListExpRanking(ListExpRankingRequest) returns (ListExpRankingResponse);
  // ListDuelRanking returns the 1v1 duel win/loss leaderboard (issue #118).
  rpc ListDuelRanking(ListDuelRankingRequest) returns (ListDuelRankingResponse);
}

// CreateResult is the outcome of a sign-up. Business outcomes (name taken,
// invalid input) are carried here, not as gRPC error codes — only infra
// failures surface as errors.
enum CreateResult {
  CREATE_RESULT_UNSPECIFIED = 0;
  CREATE_RESULT_OK = 1;          // account created; account_id is set
  CREATE_RESULT_NAME_TAKEN = 2;  // canonical name already exists
  CREATE_RESULT_INVALID = 3;     // name/password/email failed validation
  // CLOSED: sign-up is switched off on this server. Nothing about the request was
  // wrong.
  //
  // A VALUE OF ITS OWN, and not INVALID, because the page has to say something
  // true. Telling somebody their name or password failed validation, when the door
  // is simply shut, sends them to try again with a different password — and again,
  // and then to support.
  //
  // It is what the TEST server answers: the client is already in people's hands, so
  // the door is shut there and open in production.
  CREATE_RESULT_CLOSED = 4;
}

message CreateAccountRequest {
  string name = 1;     // canonicalized to lowercase server-side
  string password = 2; // plaintext over the mTLS link; hashed before storage
  string email = 3;    // optional
}

message CreateAccountResponse {
  CreateResult result = 1;
  int64 account_id = 2; // set only when result is CREATE_RESULT_OK
}

message VerifyCredentialsRequest {
  string name = 1;
  string password = 2;
}

message VerifyCredentialsResponse {
  bool ok = 1;          // name exists and password matches
  int64 account_id = 2; // set only when ok
  bool blocked = 3;     // account.is_blocked — caller decides how to surface it
  // role is account.role ('player'/'moderator'/'admin'). The BFF stores it in the
  // session to gate the moderator UI (page visibility only). It is NOT the
  // authorization decision — NpcAdminService re-checks the role server-side on
  // every call, so a tampered session flag still gets ADMIN_RESULT_FORBIDDEN.
  string role = 4;
  // discord_id e o Discord vinculado a esta conta, ou vazio quando nao ha.
  //
  // Sai na leitura que o site JA faz, em vez de numa chamada nova: a pagina
  // precisa dele no mesmo instante em que precisa do papel, e uma segunda ida ao
  // servidor para um campo seria uma ida a mais em todo login.
  //
  // DADO PESSOAL LEVE: nao entra em log nosso. Quando algo der errado no vinculo,
  // o log diz a CONTA e nao o Discord -- para depurar serve, e para responder "de
  // quem e este Discord" a staff consulta o banco.
  string discord_id = 5;
}

message SetMyDiscordLinkRequest {
  // Sempre da SESSAO. Um pedido que escolhe a conta vincula o Discord de outra
  // pessoa.
  int64 account_id = 1;
  // O snowflake numerico do Discord, como texto.
  string discord_id = 2;
}

message SetMyDiscordLinkResponse {
  DiscordLinkResult result = 1;
}

// DiscordLinkResult e por que o vinculo passou ou nao.
enum DiscordLinkResult {
  DISCORD_LINK_RESULT_UNSPECIFIED = 0;
  DISCORD_LINK_RESULT_OK = 1;
  // ALREADY_LINKED_ELSEWHERE: este Discord ja esta em OUTRA conta.
  //
  // Ele conta a quem tentou que aquele Discord existe em alguma conta deste
  // servidor. E pouco, e e inevitavel se a gente quer explicar a recusa -- fica
  // dito aqui para ninguem descobrir depois que vazou sem ter sido decidido.
  DISCORD_LINK_RESULT_ALREADY_LINKED_ELSEWHERE = 2;
  // INVALID: nao e um snowflake numerico.
  DISCORD_LINK_RESULT_INVALID = 3;
  // ACCOUNT_HAS_ANOTHER: esta conta ja tem OUTRO Discord. So a staff desfaz.
  DISCORD_LINK_RESULT_ACCOUNT_HAS_ANOTHER = 4;
}

// PixKeyType is the shape of the key, which the player's bank needs in order to
// resolve the destination.
enum PixKeyType {
  PIX_KEY_TYPE_UNSPECIFIED = 0;
  PIX_KEY_TYPE_CPF = 1;
  PIX_KEY_TYPE_EMAIL = 2;
  PIX_KEY_TYPE_PHONE = 3;
  PIX_KEY_TYPE_RANDOM = 4;
}

// PixKeyResult separates the ways it can fail so the form can say what to do
// about each. A plain boolean would force the screen to invent the reason.
enum PixKeyResult {
  PIX_KEY_RESULT_UNSPECIFIED = 0;
  PIX_KEY_RESULT_OK = 1;
  // The key does not have the shape of the declared type (a CPF without eleven
  // digits, an e-mail without an at sign, and so on).
  PIX_KEY_RESULT_INVALID = 2;
  // A charge is open against one of this seller's listings. Changing the key now
  // would divert a payment already under way.
  PIX_KEY_RESULT_SALE_IN_PROGRESS = 3;
  // The account does not exist.
  PIX_KEY_RESULT_NO_ACCOUNT = 4;
  // The CPF is missing or malformed. Separate from INVALID, which is about the
  // KEY: the form has two fields and has to be able to point at the wrong one.
  PIX_KEY_RESULT_INVALID_TAX_ID = 5;
  // PAYOUT_PENDING: ha REPASSE a caminho da chave, e por isso ela nao pode mudar.
  //
  // ACRESCENTADO NO FIM em 25/09/2026, sem renumerar nada: de 1 a 5 ficou igual.
  //
  // Ate aqui esta recusa e a de venda em curso devolviam o MESMO valor,
  // SALE_IN_PROGRESS, e as duas pedem coisas diferentes de quem le: a cobranca
  // aberta passa sozinha quando a compra fechar ou vencer, e o repasse so passa
  // quando o dinheiro sair. A pessoa nao sabia se esperava minutos ou falava com
  // a equipe.
  //
  // Travam: repasse PENDENTE, ENVIADO, INCERTO e SEM TAXA. Nao travam o RECUSADO
  // (a recusa mais comum e a chave estar errada, e travar a correcao prenderia o
  // dinheiro para sempre) nem o PAGO.
  PIX_KEY_RESULT_PAYOUT_PENDING = 6;
}

message SavePixKeyRequest {
  int64 account_id = 1;
  string key = 2;
  PixKeyType type = 3;
  // The seller's CPF, digits only.
  //
  // It is here because PAYING the seller needs it: the payout route refuses
  // without a document, and when the key is a CPF it requires the two to match —
  // the house rule is that the key must be in the seller's own name.
  //
  // WHAT IT DOES AND DOES NOT BUY, said plainly so nobody reads more into it: the
  // rule is only verifiable when the key IS a CPF. For an e-mail, a phone or a
  // random key, the processor does not say whose key it is, so storing the CPF
  // proves nothing about ownership. It is required for all of them because the
  // payout route needs a document regardless, not because it closes the rule.
  string tax_id = 4;
}

message SavePixKeyResponse {
  PixKeyResult result = 1;
}

// MarketCurrency is what a shelf is priced in.
enum MarketCurrency {
  MARKET_CURRENCY_UNSPECIFIED = 0;
  MARKET_CURRENCY_GOLD = 1;
  MARKET_CURRENCY_CASH = 2;
  MARKET_CURRENCY_REAL = 3;
}

// MarketSort is the order the page asks for.
//
// The order the GAME keeps (stall, then slot) is stable and useless to a buyer: it
// puts the same seller's items together and tells nobody what is cheap.
enum MarketSort {
  // UNSPECIFIED keeps the game's own order. Not an error, and not "no order".
  MARKET_SORT_UNSPECIFIED = 0;
  MARKET_SORT_PRICE_ASC = 1;
  MARKET_SORT_PRICE_DESC = 2;
  // NEWEST is the stall that went up most recently, which is the smallest
  // open_for_seconds.
  MARKET_SORT_NEWEST = 3;
}

message ListMarketListingsRequest {
  // WHICH CURRENCY, and it is REQUIRED: UNSPECIFIED is refused with
  // INVALID_ARGUMENT.
  //
  // Refused rather than answered with everything, because of the sort: ordering by
  // price across currencies would put 300 gold beside 300 cents and call the list
  // sorted. And refused rather than answered empty, because an empty list reads as
  // "nothing for sale" — a lie the caller would spend an afternoon debugging.
  MarketCurrency currency = 1;

  // ONE-BASED. Zero is read as the first page, which is the forgiving reading of a
  // field somebody forgot to fill.
  //
  // A page past the end returns an EMPTY list with the real total, never an error:
  // the list shrinks between two clicks all the time — a stall closes — and a
  // person arriving at page 3 of a market that now has two pages did nothing wrong.
  int32 page = 2;

  // How to order. See MarketSort.
  MarketSort sort = 3;

  // ONE ITEM ONLY, for "who is selling this". Zero means every item.
  int32 item_index = 4;
}

message MarketListing {
  int32 item_index = 1;
  int32 refine = 2;
  // How many are on the shelf. They are sold TOGETHER, for `price`.
  int32 amount = 3;
  MarketCurrency currency = 4;
  // In the currency's own unit: gold, cash, or CENTS for real money. The unit is
  // not guessable from the number, which is why the currency travels beside it.
  //
  // IT IS THE PRICE OF THE WHOLE SHELF, not of one unit. A shelf holding a stack of
  // five at 1000 gold costs 1000 gold, and the buyer gets all five: the game charges
  // `slot.Price` once and moves the entire stack out of the seller's warehouse
  // (tmserver/internal/handler/lojacompra.go — `preco := slot.Price`, then
  // `e.Coin -= preco` and `e.Carry[destino] = itemCargo`, which is the stack itself).
  //
  // Measured in the buy handler and not assumed, because a page that divides by
  // `amount` to show a unit price would advertise a fifth of the real cost.
  int64 price = 5;
  // The CHARACTER standing in the stall. The only name in this contract.
  string seller_character = 6;
  // The city the stall stands in, already written out ("Armia"). Empty outside a
  // city, which happens and is not an error.
  string village = 7;
  // HOW LONG THE STALL HAS BEEN UP, in seconds, measured at the moment this answer
  // was built — including the time it sat in the server's cache.
  //
  // A duration and not a date because the game's own clock is a tick counter, not
  // a wall clock: a date built from it would be wrong after a restart.
  int64 open_for_seconds = 8;
}

message ListMarketListingsResponse {
  repeated MarketListing listings = 1;
  // How many matched the filters before the page was cut, so the page can say
  // "1 of 4". It counts the WHOLE match, not this page.
  int32 total = 2;
  // HOW OLD THIS ANSWER IS. Zero means it came from the game just now; anything
  // else is the age of the cache.
  //
  // It is in the contract because the page is allowed to be stale and the visitor is
  // not supposed to find that out by buying something that is gone.
  //
  // THE CEILING IS ONE MINUTE, and the page may say so. Normally this is at most a
  // few seconds; when the game server is not answering, the last good list keeps
  // being served for up to a minute — an empty market reads as "nobody is selling",
  // which would be the bigger lie — and past that the call fails instead.
  //
  // Nothing wrong is handed to anyone by a stale list: this is a shop WINDOW, and
  // the purchase is checked again inside the game, which refuses a shelf that is
  // gone.
  int32 cached_for_seconds = 3;
}

message GetPixKeyRequest {
  int64 account_id = 1;
}

message GetPixKeyResponse {
  bool has_key = 1;
  // Masked: only enough for the person to recognize their own key. Empty when
  // there is no key.
  string masked_key = 2;
  PixKeyType type = 3;
  bool verified = 4;
  // MASKED, never whole, exactly like masked_key and for the same reason: the
  // form only needs to say "CPF ending in 01" so the person recognizes their own.
  // A CPF is personal data and the site is public — returning it in full would
  // put it in the browser, and from there in the history, the cache and every
  // installed extension.
  //
  // Empty when no CPF was ever saved, which is every seller registered before
  // this field existed.
  string masked_tax_id = 5;

  // THE MONEY OWED TO THIS SELLER THAT HAS NOT REACHED THEM YET, in cents, added
  // up across every sale.
  //
  // It lives on the KEY response, and that placement is the point: the page that
  // shows "you already registered ...1234" is the page where somebody goes when
  // they are wondering where their money is. A separate call would be a separate
  // screen nobody opens.
  //
  // A TOTAL AND NOTHING ELSE. No sale, no date, no buyer — for the same reason
  // the key comes back masked. Somebody reading over a shoulder, or a screenshot
  // in a Discord channel, should not learn what this person sold and to whom.
  // The detail belongs to staff, who can be asked.
  //
  // ZERO MEANS ONE OF TWO THINGS, and the page cannot tell them apart: nothing is
  // owed, OR the total could not be read. A failure while adding it up does NOT
  // fail the call — it returns zero with UNSPECIFIED and logs on the server.
  //
  // The reason is that this field rides along on the KEY response, and the key
  // response is what the form needs to work. That form is where an incomplete
  // registration gets fixed, and an incomplete registration is the most common
  // cause of money sitting still: letting a failed total take down the whole
  // answer would black out the very screen that solves the problem.
  //
  // WHAT THE PAGE MUST NOT DO, therefore, is write "you have nothing to receive"
  // in so many words on a zero. Showing no line at all is the honest rendering of
  // "nothing pending, or we could not tell".
  //
  // Zero is also NOT the same as "paid": a payout that arrived stops being owed
  // and leaves this total.
  int64 pending_payout_cents = 6;

  // Why it has not arrived, so the page can say something other than "wait".
  //
  // UNSPECIFIED when pending_payout_cents is zero — both when nothing is owed,
  // with no waiting to explain, and when the total could not be read.
  PayoutWaitReason payout_wait_reason = 7;
}

message DeletePixKeyRequest {
  // Sempre da SESSAO, nunca do corpo, como no SavePixKey: um pedido que escolhe
  // de quem e a chave e um pedido que apaga a chave dos outros.
  int64 account_id = 1;
}

message DeletePixKeyResponse {
  PixKeyDeleteResult result = 1;
}

// PixKeyDeleteResult e por que o apagar passou ou nao.
enum PixKeyDeleteResult {
  PIX_KEY_DELETE_RESULT_UNSPECIFIED = 0;
  PIX_KEY_DELETE_RESULT_OK = 1;
  // NO_KEY: nao havia chave para apagar.
  //
  // Separado do OK de proposito: a tela precisa distinguir "apaguei agora" de
  // "nao havia nada", senao ela confirma uma acao que nao aconteceu.
  PIX_KEY_DELETE_RESULT_NO_KEY = 2;
  // SALE_IN_PROGRESS: ha cobranca ABERTA de um anuncio deste vendedor.
  PIX_KEY_DELETE_RESULT_SALE_IN_PROGRESS = 3;
  // PAYOUT_PENDING: ha repasse a caminho -- pendente, enviado, incerto ou
  // segurado por taxa desconhecida. Recusado e pago nao travam.
  PIX_KEY_DELETE_RESULT_PAYOUT_PENDING = 4;
}

// PayoutWaitReason answers the only question a seller with money owed actually
// has: is this on me, or on you?
//
// THE ORDER OF PRECEDENCE is NO_KEY_OR_TAX_ID, then NEEDS_STAFF, then
// IN_PROGRESS. Registration wins because it is the only one the person can do
// something about: telling somebody "we are looking into it" while their own
// registration is what blocks the payment leaves them waiting for a day that
// never comes.
//
// The first two cannot both be true today — a payout only reaches a staff state
// after an attempt, an attempt requires the document, and a stored document is
// never removed. The order is written because the choice had to be made
// somewhere, not because the case occurs.
enum PayoutWaitReason {
  PAYOUT_WAIT_REASON_UNSPECIFIED = 0;
  // NO_KEY_OR_TAX_ID: the registration is incomplete, so there is nowhere to
  // send the money. This is the seller's to fix, and finishing the form puts the
  // payment in the queue by itself.
  //
  // It is the common case for anybody who sold before the CPF became required:
  // the key is there and the document is not.
  PAYOUT_WAIT_REASON_NO_KEY_OR_TAX_ID = 1;
  // IN_PROGRESS: the registration is complete and the payment is on its way, or
  // is about to be. Nothing to do but wait, and the wait is minutes.
  PAYOUT_WAIT_REASON_IN_PROGRESS = 2;
  // NEEDS_STAFF: the payment was refused, or the answer never came back and we
  // do not know whether it left. A person has to look at it.
  //
  // The page must NOT tell the seller to redo anything here. A refusal caused by
  // a wrong key is fixed by correcting the key, which is allowed precisely in
  // this state — but a refusal has other causes, and "try again" as blanket
  // advice would have people editing a correct key for nothing.
  PAYOUT_WAIT_REASON_NEEDS_STAFF = 3;
}

// PixChargeState is where the buyer's charge stands.
//
// EVERY CLOSED STATE IS NAMED, and none of them is folded into an empty answer.
// The reason is the same for all of them and it is not symmetry for its own sake:
// each one is a different sentence the page has to be able to say to a person who
// just sent money somewhere. "Your time ran out", "we got it, the item is on its
// way", "it was cancelled because you left the game" and "it arrived late and is
// being looked at" are four different situations, and a blank page says none of
// them.
enum PixChargeState {
  PIX_CHARGE_STATE_UNSPECIFIED = 0;
  // OPEN: the code is good and the deadline has not passed. Pay it.
  PIX_CHARGE_STATE_OPEN = 1;
  // EXPIRED: the deadline passed. The sweep may not have closed the row yet, and
  // that does not change what the page says.
  PIX_CHARGE_STATE_EXPIRED = 2;
  // PAID: the money arrived and the item is on its way to the buyer's mailbox.
  //
  // The single most important state to NOT leave blank: the person has just sent
  // money, and a screen that empties at that exact moment is the screen that
  // makes them open a ticket.
  PIX_CHARGE_STATE_PAID = 3;
  // CANCELED: a processadora RECUSOU gerar o codigo Pix desta cobranca (recusa
  // definitiva da ponte, 4xx).
  //
  // A cobranca foi fechada sem codigo, entao NADA foi cobrado de ninguem. O
  // anuncio continua ATIVO e o item segue a venda -- ele nunca saiu da barraca;
  // quem e liberado e o COMPRADOR, que volta a poder comprar. Sem esse
  // fechamento ele ficaria preso a uma cobranca morta.
  //
  // Hoje e a recusa definitiva da ponte que produz este estado
  // (store.FecharCobrancaPorRecusaDefinitiva). Existe uma segunda funcao capaz
  // de gravar CANCELED -- a desistencia do comprador, CancelarCobrancaRMT --,
  // mas ela esta SEM CHAMADOR: medido em 25/09/2026, e por isso o texto diz
  // "hoje" em vez de "o unico caminho".
  //
  // O site mostra: "Nao foi possivel gerar o pagamento. Nada foi cobrado. Tente
  // comprar de novo no jogo."
  PIX_CHARGE_STATE_CANCELED = 4;
  // PAID_LATE: the money arrived AFTER the charge had closed; the item was not
  // delivered and the amount is refunded automatically through the processor.
  // refund_state and refund_requested_at say how far that refund has got.
  //
  // The case is real and unavoidable, which is why it is a state and not an
  // accident: there is no known route to cancel a cash-in at the processor, so
  // the copy-and-paste code stays payable after our row closes.
  //
  // IT ALSO CARRIES THE WRONG-AMOUNT CASE, and the reuse is deliberate: the name
  // speaks of lateness and that case is not late, but what the state TELLS the
  // person is exactly right — the money arrived, the item was not delivered, and
  // somebody is looking at it. Every other value would lie worse. OPEN says "pay",
  // and they already paid, which invites paying twice; PAID says the item is on
  // its way; EXPIRED and CANCELED say no payment happened.
  //
  // The two are told apart by refund_state. Late payment refunds automatically, so
  // it moves through PENDING, REQUESTED, REFUNDED. A wrong amount leaves it
  // UNSPECIFIED, because there is no automatic refund: refunding, charging the
  // difference or delivering anyway is a decision about two people's money, and
  // the code does not make it.
  //
  // Implementation status: the server PRODUCES this state as of the payment-notice
  // change. Paying the seller, however, does not exist yet — see the note on
  // masked_tax_id.
  PIX_CHARGE_STATE_PAID_LATE = 5;
}

message GetMyCurrentPixChargeRequest {
  // The logged-in account, as the site's BFF resolved it. The buyer can only ever
  // see their own charge: there is no parameter for whose charge to read, on
  // purpose.
  int64 account_id = 1;
}

message GetMyCurrentPixChargeResponse {
  // has_charge false means there is nothing to show. Every field below is then
  // empty, and the page shows its ordinary state.
  bool has_charge = 1;
  // pix_code is the copy-and-paste string, exactly as the payment processor
  // returned it. It is not re-encoded, reformatted or validated here: a Pix code
  // is checksummed end to end, and a server that "tidies" it breaks payments in a
  // way nobody can see until money fails to arrive.
  //
  // Empty while the charge exists and the processor has not answered yet, and
  // empty in every closed state — a dead charge shown beside a live code invites
  // somebody to pay it.
  //
  // The site does not draw a QR code from it (it has no renderer and does not
  // need one) — it shows the string with a copy button.
  string pix_code = 2;
  // In CENTS, like everywhere else in this system. The name says cents so nobody
  // has to remember.
  int64 amount_cents = 3;
  // When the code stops being good. Unix seconds, UTC.
  //
  // The DEADLINE and not the remaining seconds: a countdown computed here is
  // already wrong when it arrives, and the page can count down from a deadline by
  // itself.
  int64 expires_at = 4;
  PixChargeState state = 5;
  // What is being bought, from the LISTING'S SNAPSHOT and not from the seller's
  // live warehouse.
  //
  // The snapshot is the answer to "what exactly did I pay for" after the item has
  // left the warehouse, and it is also the only source that works while the
  // seller is offline. item_index is the catalog index; the site turns it into a
  // name and an icon with the catalog it already has.
  int32 item_index = 6;
  // refine_level and stack_size are what the panel shows beside an item in the
  // game, so the site can show the same thing rather than a bare index.
  int32 refine_level = 7;
  int32 stack_size = 8;
  // The seller's character name, for the buyer to recognize whom they are buying
  // from. Never the seller's account name, and never their Pix key: the key is
  // inside the pix_code and nowhere else in this answer.
  string seller_name = 9;
  // When the refund was ASKED FOR. Unix seconds, UTC; 0 when nothing was asked.
  //
  // The date and not "how long is left", for the same reason as expires_at — and
  // here it matters more, because the wait is long: the processor reserves the
  // amount immediately and the review takes UP TO TWO BUSINESS DAYS (measured on
  // their panel on 23/09/2026; it is not in the API docs). The page counts from
  // this date.
  int64 refund_requested_at = 10;
  RefundState refund_state = 11;
  // Onde esta o item depois de pago: a caminho, ou segurado porque o bau esta
  // cheio.
  //
  // A pagina mostrava "o item esta a caminho" para DUAS situacoes diferentes: a
  // entrega que acontece no proximo login, e a que nao acontece nenhuma vez ate a
  // pessoa esvaziar o bau. Quem estava na segunda esperava um dia que nao chega.
  DeliveryState delivery_state = 12;
}

// DeliveryState diz onde esta o item de uma compra ja paga.
//
// CALCULADO NA LEITURA, e nao guardado: quem descobre que o item nao cabe e o
// servidor de jogo, no seu proprio laco, e ele so fala com o banco por gRPC --
// marcar uma coluna exigiria um RPC novo, e quando NADA e entregue o dreno nem
// chega a chamar o banco. Alem disso o calculado e mais honesto: uma coluna diria
// "nao cabia as 02h10" e envelheceria, enquanto isto diz "nao cabe agora".
//
// "SEM ESPACO LIVRE" NAO E "NAO CABE": item que empilha entra num bau lotado.
// Por isso a tela afirma o FATO ("o bau esta sem espaco livre") e nao a previsao
// -- assim a frase nao fica falsa quando o item empilhar e entrar.
enum DeliveryState {
  // UNSPECIFIED: nao ha linha de entrega. Ainda nao pago, ou sem entrega.
  DELIVERY_STATE_UNSPECIFIED = 0;
  // WAITING: pago e na fila. Chega no proximo dreno, que e o login ou a entrega
  // imediata.
  DELIVERY_STATE_WAITING = 1;
  // HELD: esta na fila E o bau da conta nao tem espaco livre.
  DELIVERY_STATE_HELD = 2;
  // DELIVERED: o item entrou no bau.
  DELIVERY_STATE_DELIVERED = 3;
  // LOST: a linha foi encerrada sem entregar. Nao acontece sozinha.
  DELIVERY_STATE_LOST = 4;
}

// RefundState is how far the money that arrived late has got on its way back.
//
// It is its own field and not another PixChargeState because the two move on
// different clocks: the charge closed in seconds, and the refund can take days.
// Folding them together would mean a state for every pair.
enum RefundState {
  REFUND_STATE_UNSPECIFIED = 0;
  // PENDING: we owe the refund and have not asked the processor yet.
  REFUND_STATE_PENDING = 1;
  // REQUESTED: the processor accepted the request and is reviewing it. This is
  // the state that lasts up to two business days.
  REFUND_STATE_REQUESTED = 2;
  // REFUNDED: done. The money went back.
  REFUND_STATE_REFUNDED = 3;
  // FAILED: the processor refused the request.
  //
  // It does NOT retry in a loop and it does NOT age out of the page: it waits
  // for a person. The processor's error code is not in this contract — it goes
  // to the log and to the staff screen, because it is an operational detail and
  // the buyer can do nothing with it.
  REFUND_STATE_FAILED = 4;
}

// SyncpayEventKind says which way the money moved.
//
// The two are handled very differently, and that is the reason they share one
// method instead of being two: the kind is the first thing the server branches
// on, and a caller that has to choose the method would be choosing the branch.
enum SyncpayEventKind {
  SYNCPAY_EVENT_KIND_UNSPECIFIED = 0;
  // CASHIN: a buyer paid. NOTHING in the notice is believed — the server queries
  // the processor and decides from the answer.
  SYNCPAY_EVENT_KIND_CASHIN = 1;
  // CASHOUT: a seller was paid out. This one is a RECORD, not a decision: the
  // money already left, and the notice only says how much arrived after the
  // processor's fee. Nothing is delivered or paid because of it.
  SYNCPAY_EVENT_KIND_CASHOUT = 2;
}

message NotifySyncpayEventRequest {
  SyncpayEventKind kind = 1;
  // The processor's own identifier, never one of ours. It is the only field the
  // server uses from a CASHIN notice, and it is used to ASK, not to conclude.
  string identifier = 2;
  // CASHOUT only, and taken at face value. amount_cents is what we asked to send
  // and final_amount_cents is what arrived; the difference is the withdrawal fee,
  // which is the whole reason this event is relayed at all.
  //
  // Believing a notice is acceptable HERE and nowhere else on this path: nothing
  // is delivered or paid from it, the money already moved, and there is no other
  // known source — the query endpoint answers 404 for non-sale transactions. A
  // value that disagrees with what the bridge asked for raises a staff alert.
  int64 amount_cents = 3;
  int64 final_amount_cents = 4;
}

message NotifySyncpayEventResponse {
  // handled is false when the event was not ours — an identifier with no charge
  // behind it, most often the donation shop's own traffic. NOT an error: it is
  // the ordinary answer, and treating it as failure would make the site retry
  // forever over somebody else's payment.
  bool handled = 1;
}

message ListExpRankingRequest {
  int32 limit = 1;  // default 50, max 100
  int32 offset = 2; // negative values are treated as 0
}

message RankingEntry {
  int32 rank = 1; // 1-based rank in the full ordered list
  string name = 2;
  int32 class = 3;
  int32 clan = 4;
  uint32 guild_id = 5;
  int32 level = 6;
  int64 exp = 7;
  int32 class_master = 8;
}

message ListExpRankingResponse {
  repeated RankingEntry entries = 1;
  int32 total_count = 2;
}

message ListDuelRankingRequest {
  int32 limit = 1;  // default 50, max 100
  int32 offset = 2; // negative values are treated as 0
}

message DuelRankingEntry {
  int32 rank = 1; // 1-based rank in the full ordered list
  string name = 2;
  int32 class = 3;
  int32 clan = 4;
  uint32 guild_id = 5;
  int32 wins = 6;
  int32 losses = 7;
}

message ListDuelRankingResponse {
  repeated DuelRankingEntry entries = 1;
  int32 total_count = 2;
}

// CharacterWebService exposes player-facing, read-only character summaries for
// the Next.js BFF. The BFF must pass the account_id from its httpOnly session;
// the browser must never provide account_id directly.
service CharacterWebService {
  // ListMyCharacters returns the character-selection projection for the logged
  // account. It is cold-storage data and can be slightly stale while a character
  // is online; live state remains owned by tmServer's single goroutine.
  rpc ListMyCharacters(ListMyCharactersRequest) returns (ListMyCharactersResponse);

  // O EMBLEMA DE GUILDA, 25/09/2026.
  //
  // Nao existia nada de emblema no servidor antes disto: nem coluna, nem campo,
  // nem rota. A tabela guild (migracao 0012) tem id, name, clan, fame e citizen.
  //
  // LIDER e guild_member.guild_level = 9 (internal/domain, guildLeaderLevel), e e
  // esse o criterio do NOT_LEADER -- nao "quem criou".
  rpc ListMyLedGuilds(ListMyLedGuildsRequest) returns (ListMyLedGuildsResponse);
  rpc SetMyGuildEmblem(SetMyGuildEmblemRequest) returns (SetMyGuildEmblemResponse);
  rpc ClearMyGuildEmblem(ClearMyGuildEmblemRequest) returns (ClearMyGuildEmblemResponse);
  // GetGuildEmblem e PUBLICO: e por ele que a pagina da guilda mostra a imagem.
  rpc GetGuildEmblem(GetGuildEmblemRequest) returns (GetGuildEmblemResponse);
}

message ListMyLedGuildsRequest {
  // Da SESSAO. Quem esta logado no site e a CONTA, e a lideranca e do
  // PERSONAGEM: o servidor resolve isso procurando, entre os personagens daquela
  // conta, os que tem guild_level 9. Assim o site nao precisa saber qual
  // personagem lidera qual guilda.
  int64 account_id = 1;
}

message ListMyLedGuildsResponse {
  // PLURAL porque uma conta tem ate 4 personagens (guild_member.slot vai de 0 a
  // 3), e nada impede dois deles liderarem guildas diferentes. Uma tela que
  // assuma uma so erra no dia em que isso acontecer.
  repeated LedGuild guilds = 1;
}

message LedGuild {
  int32 guild_id = 1;
  string name = 2;
  bool has_emblem = 3;
}

message SetMyGuildEmblemRequest {
  int64 account_id = 1;
  int32 guild_id = 2;
  // O BMP inteiro, exatamente como o cliente 1.0.0 le (medido pela dupla do
  // cliente em gamepatch/emblema.cpp, LeBmpDoEmblema):
  //
  //   24 bits, 16x12, SEM transparencia, EXATAMENTE 630 bytes;
  //   offset 0 "BM"; bfSize (u32 LE @2) = 630; bfOffBits (@10) = 54;
  //   biSize (@14) = 40; biWidth (@18) = 16; biHeight (@22) = +12 (de baixo
  //   para cima, positivo); biPlanes (@26) = 1; biBitCount (@28) = 24;
  //   biCompression (@30) = 0 (BI_RGB);
  //   pixels em BGR, 48 bytes por linha sem padding, 576 no total.
  //
  // Qualquer outra coisa e INVALID_IMAGE. O teto de 632 do cliente e folga dele;
  // fechamos em 630. A VALIDACAO E NO SERVIDOR: um cliente remendado nao pode
  // gravar imagem que o jogo nao desenha.
  bytes image = 3;
}

message SetMyGuildEmblemResponse {
  GuildEmblemResult result = 1;
}

message ClearMyGuildEmblemRequest {
  int64 account_id = 1;
  int32 guild_id = 2;
}

message ClearMyGuildEmblemResponse {
  GuildEmblemResult result = 1;
}

message GetGuildEmblemRequest {
  int32 guild_id = 1;
}

message GetGuildEmblemResponse {
  // has_emblem separado de image porque, sem ele, "nao tem emblema" e "falhei ao
  // ler" viram o mesmo bytes vazio -- e a pagina nao sabe se mostra o padrao ou
  // um aviso.
  bool has_emblem = 1;
  bytes image = 2;
  // Quando o emblema mudou pela ultima vez, em segundos Unix UTC. ZERO quando
  // has_emblem e falso. E o que a rota de imagem do site usa para mandar o
  // Last-Modified certo.
  int64 updated_at_unix = 3;
}

// GuildEmblemResult e por que a troca passou ou nao.
enum GuildEmblemResult {
  GUILD_EMBLEM_RESULT_UNSPECIFIED = 0;
  GUILD_EMBLEM_RESULT_OK = 1;
  // NOT_LEADER: nenhum personagem desta conta lidera a guilda pedida.
  GUILD_EMBLEM_RESULT_NOT_LEADER = 2;
  // INVALID_IMAGE: o BMP nao bate com o formato descrito em SetMyGuildEmblem.
  GUILD_EMBLEM_RESULT_INVALID_IMAGE = 3;
  // RATE_LIMITED: uma troca (Set ou Clear) a cada 5 minutos POR GUILDA.
  //
  // Por guilda e nao por conta, porque o custo e a imagem trocando para todos os
  // membros.
  GUILD_EMBLEM_RESULT_RATE_LIMITED = 4;
}

message ListMyCharactersRequest {
  int64 account_id = 1; // from the BFF session, never from browser input
}

message WebCharacterSummary {
  int32 slot = 1;
  string name = 2;
  int32 class = 3;
  int32 level = 4;
  int64 exp = 5;
  int32 coin = 6;
  int32 max_hp = 7;
  int32 hp = 8;
  int32 max_mp = 9;
  int32 mp = 10;
  int32 str = 11;
  int32 int = 12;
  int32 dex = 13;
  int32 con = 14;
}

message ListMyCharactersResponse {
  repeated WebCharacterSummary characters = 1;
}

// ItemCatalogService exposes the item catalog read-only to the player-facing
// screens that have to render an item (donate shop, daily reward, drop tables,
// world events). Unlike NpcAdminService.ListItemCatalog it takes no
// moderator_id: the catalog is public, immutable content read from the
// read-only Release/ mount at boot, not account data.
//
// The whole list is ~3.2k entries; the BFF is expected to fetch it once and
// cache it against catalog_version rather than call per item.
service ItemCatalogService {
  // ListItems returns the full catalog. Empty (not an error) when the service
  // runs without -content/W2PP_CONTENT.
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
}

message ListItemsRequest {}
message ListItemsResponse {
  repeated ItemCatalogEntry items = 1;
  // catalog_version fingerprints ItemList.csv; it only changes on redeploy, so
  // the BFF can cache the list indefinitely and revalidate on this value.
  string catalog_version = 2;
  // icon_pack_version fingerprints itemicon.bin and its numbered atlases. It
  // is the immutable CDN path segment; empty means fallback-only mode.
  string icon_pack_version = 3;
}

// NpcAdminService is the moderator-facing NPC editing surface (npc-editing-plan.md).
// The Next.js BFF calls it server-side after establishing a moderator session;
// every request carries the moderator's account_id, which the web-api authorizes
// against account.role ('moderator'/'admin') and records in the audit trail. All
// writes are cold config in Postgres — never live game state, which stays in
// tmServer's single-owner loop.
service NpcAdminService {
  // ListNpcs returns every NPC definition (moderation table).
  rpc ListNpcs(ListNpcsRequest) returns (ListNpcsResponse);
  // GetNpc returns one definition with its shop stock.
  rpc GetNpc(GetNpcRequest) returns (GetNpcResponse);
  // UpsertNpc creates or updates a definition (position, visibility, merchant type).
  rpc UpsertNpc(UpsertNpcRequest) returns (UpsertNpcResponse);
  // SetNpcVisibility toggles whether the NPC appears ("aparece ou não").
  rpc SetNpcVisibility(SetNpcVisibilityRequest) returns (AdminAck);
  // SetNpcShop replaces a merchant NPC's shop stock.
  rpc SetNpcShop(SetNpcShopRequest) returns (AdminAck);
  // SetItemPrice sets (price>=0) or clears (price<0) the GLOBAL price of an item.
  rpc SetItemPrice(SetItemPriceRequest) returns (AdminAck);
  // DeleteNpc removes a definition.
  rpc DeleteNpc(DeleteNpcRequest) returns (AdminAck);
  // ListMerchantTemplates returns the supported NPC templates found in the
  // content tree (Release/TMsrv/run/npc/), so the moderator UI can offer a
  // searchable picker instead of a free-text template_name field. Scanned once
  // at web-api boot from -content/W2PP_CONTENT; empty when that flag is unset.
  rpc ListMerchantTemplates(ListMerchantTemplatesRequest) returns (ListMerchantTemplatesResponse);
  // ListItemCatalog returns the item catalog (Release/Common/ItemList.csv:
  // item_index, name), so the shop-item editor (SetNpcShop/SetItemPrice) can
  // offer a searchable picker instead of a raw item_index typed by hand.
  // Scanned once at web-api boot from -content/W2PP_CONTENT; empty when unset.
  rpc ListItemCatalog(ListItemCatalogRequest) returns (ListItemCatalogResponse);
  // ListDropItems returns the DropTool-style item-centric report from the
  // content tree: item -> mobs/slots that can drop it. This is read-only
  // content metadata; the tmServer runtime still owns actual drop rolls.
  rpc ListDropItems(ListDropItemsRequest) returns (ListDropItemsResponse);
  // ListMobDrops returns the DropTool-style mob-centric report from the
  // content tree: mob template -> Carry[] drop slots.
  rpc ListMobDrops(ListMobDropsRequest) returns (ListMobDropsResponse);
  // ListItemPrices returns every global item price override currently set
  // (item_price table). An item absent from the list has no override — it
  // uses the content catalog's base price.
  rpc ListItemPrices(ListItemPricesRequest) returns (ListItemPricesResponse);
  // ListMapZones returns the fixed city-zone table (label only: the world runs
  // a single grid, so map_id has no gameplay effect today) for the NPC form's
  // map picker instead of a raw map_id typed by hand.
  rpc ListMapZones(ListMapZonesRequest) returns (ListMapZonesResponse);
}

// AdminResult carries the business outcome of an admin write (authorization,
// validation, missing target) in the body — only infra failures become gRPC errors.
enum AdminResult {
  ADMIN_RESULT_UNSPECIFIED = 0;
  ADMIN_RESULT_OK = 1;
  ADMIN_RESULT_FORBIDDEN = 2;  // caller is not a moderator/admin
  ADMIN_RESULT_INVALID = 3;    // validation failed (bad slot, unknown target, …)
  ADMIN_RESULT_NOT_FOUND = 4;  // target definition does not exist
  ADMIN_RESULT_CONTENT_OWNED = 5; // content definitions must be hidden, not deleted
}

message AdminAck { AdminResult result = 1; }

// AdminNpcShopItem mirrors the DB shop slot; price is global, not per-slot.
message AdminNpcShopItem {
  int32 slot = 1;
  int32 item_index = 2;
  int32 eff1 = 3;  int32 effv1 = 4;
  int32 eff2 = 5;  int32 effv2 = 6;
  int32 eff3 = 7;  int32 effv3 = 8;
  // quantity is the stack amount sold by this slot. 0 is accepted as 1 for
  // older callers; values >1 are materialized as EF_AMOUNT in the legacy item.
  int32 quantity = 9;
  // price_points sells this slot for shop points (0060) instead of gold.
  // Optional, and absent is the ordinary case: leaving it out keeps the item on
  // sale for the catalog's gold price. Zero means free to anyone with a wallet.
  optional int32 price_points = 10;
}

message AdminNpc {
  int64 id = 1;
  string slug = 2;
  string template_name = 3;
  string display_name = 4;
  bool enabled = 5;
  int32 map_id = 6;
  int32 pos_x = 7;
  int32 pos_y = 8;
  int32 route_type = 9;
  int32 merchant = 10;
  repeated AdminNpcShopItem shop = 11;
  string origin = 12;
  int32 generator_index = 13;
}

message ListNpcsRequest { int64 moderator_id = 1; }
message ListNpcsResponse {
  AdminResult result = 1;
  repeated AdminNpc npcs = 2;
}

message GetNpcRequest {
  int64 moderator_id = 1;
  int64 npc_id = 2;
}
message GetNpcResponse {
  AdminResult result = 1;
  AdminNpc npc = 2;
}

message UpsertNpcRequest {
  int64 moderator_id = 1;
  // id is ignored on create; the slug is the stable key. Position/visibility/
  // merchant fields are applied as given.
  string slug = 2;
  string template_name = 3;
  string display_name = 4;
  bool enabled = 5;
  int32 map_id = 6;
  int32 pos_x = 7;
  int32 pos_y = 8;
  int32 route_type = 9;
  int32 merchant = 10;
}
message UpsertNpcResponse {
  AdminResult result = 1;
  int64 npc_id = 2;
}

message SetNpcVisibilityRequest {
  int64 moderator_id = 1;
  int64 npc_id = 2;
  bool enabled = 3;
}

message SetNpcShopRequest {
  int64 moderator_id = 1;
  int64 npc_id = 2;
  repeated AdminNpcShopItem items = 3;
}

message SetItemPriceRequest {
  int64 moderator_id = 1;
  int32 item_index = 2;
  int64 price = 3; // < 0 clears the override
}

message DeleteNpcRequest {
  int64 moderator_id = 1;
  int64 npc_id = 2;
}

// MerchantTemplate is one supported STRUCT_MOB template found under
// Release/TMsrv/run/npc/.
message MerchantTemplate {
  string template_name = 1; // exact value for UpsertNpc.template_name (no .txt)
  string display_name = 2;  // the template's mob.Name, for the picker UI
  int32 merchant = 3;       // CurrentScore.Merchant (1, 2, 19, 100, …)
}

message ListMerchantTemplatesRequest { int64 moderator_id = 1; }
message ListMerchantTemplatesResponse {
  AdminResult result = 1;
  repeated MerchantTemplate templates = 2;
}

// ItemCatalogEntry is one row of Release/Common/ItemList.csv, trimmed to what
// the shop-item picker and the item icons need (the full row also carries
// price/effects, not relevant here — see tmserver/internal/content.ItemEntry).
//
// The classic client resolves the image through itemicon.bin, a direct mapping
// from item_index to a 35x35 cell in UI/itemiconNN.wyt. mesh/texture/slot remain
// useful fallback metadata but do not identify the image.
message ItemCatalogEntry {
  int32 item_index = 1;
  string name = 2;          // raw catalog name, e.g. "Botas_Douradas(N)"
  string icon_key = 3;      // generated atlas-cell key "iNNNN"; empty = fallback
  string display_name = 4;  // name with underscores turned back into spaces
  int32 slot_mask = 5;      // nPos: bitmask over STRUCT_MOB.Equip[16]; 0 = not equippable
  repeated string slots = 6; // slot_mask decoded ("boots", "weapon", …)
  int32 grade = 7;          // 1=Normal 2=Místico 3=Arcano 4=Lendário …
  int32 mesh = 8;           // IndexMesh: model/appearance
  int32 texture = 9;        // IndexTexture: colour variant of that model
  string icon_url = 10;     // public storage-manager URL; empty = fallback
}

message ListItemCatalogRequest { int64 moderator_id = 1; }
message ListItemCatalogResponse {
  AdminResult result = 1;
  repeated ItemCatalogEntry items = 2;
  string catalog_version = 3;
  string icon_pack_version = 4;
}

message DropItemMob {
  string template_name = 1; // Release/TMsrv/run/npc file name
  string mob_name = 2;      // STRUCT_MOB.Name decoded as Latin-1
  int32 mob_level = 3;      // STRUCT_MOB.CurrentScore.Level
  int32 slot = 4;           // Carry[] slot; controls the base drop divisor
  int32 rate_divisor = 5;   // g_pDropRate[slot]; larger means rarer
  // effective_divisor is the number the game actually rolls against for this
  // mob and slot: one kill in effective_divisor drops the item, so the chance is
  // 100/effective_divisor per cent.
  //
  // rate_divisor is the raw table value and is NOT the chance. The mob level
  // scales it, and four Carry slots are hard overrides — slot 11 is guaranteed,
  // where the table alone would suggest one kill in four. A UI must show this
  // field, not that one.
  //
  // Computed with a killer drop bonus of 0: the floor every player shares.
  int32 effective_divisor = 6;
  // origins is where this template spawns from NPCGener, busiest first — the
  // same index the mob editor shows. Empty with ListDropItemsResponse.origins_known
  // set means no generator spawns it: the drop is on a template no player meets
  // in the open world (an instance, quest or summon may still create it).
  repeated AdminMobOrigin origins = 7;
}

message DropItemEntry {
  int32 item_index = 1;
  string item_name = 2;
  repeated DropItemMob mobs = 3;
}

message ListDropItemsRequest {
  int64 moderator_id = 1;
  int32 item_index = 2;               // 0 = no exact item filter
  string item_query = 3;              // substring match on item name or index
  string mob_query = 4;               // substring match on mob/template name
  bool include_zero_drop_items = 5;   // include catalog items with no matching mobs
}

message ListDropItemsResponse {
  AdminResult result = 1;
  repeated DropItemEntry items = 2;
  // origins_known is false when the spawn index was not built (no content tree
  // at boot); an empty origins list then means "unknown", not "spawns nowhere".
  bool origins_known = 3;
}

message MobDropItem {
  int32 slot = 1;          // Carry[] slot; controls the base drop divisor
  int32 item_index = 2;
  string item_name = 3;
  int32 rate_divisor = 4;  // g_pDropRate[slot]; larger means rarer
  // effective_divisor is the number the game actually rolls against for this
  // mob and slot: one kill in effective_divisor drops the item, so the chance is
  // 100/effective_divisor per cent.
  //
  // rate_divisor is the raw table value and is NOT the chance. The mob level
  // scales it, and four Carry slots are hard overrides — slot 11 is guaranteed,
  // where the table alone would suggest one kill in four. A UI must show this
  // field, not that one.
  //
  // Computed with a killer drop bonus of 0: the floor every player shares.
  int32 effective_divisor = 5;
}

message MobDropEntry {
  string template_name = 1; // Release/TMsrv/run/npc file name
  string mob_name = 2;      // STRUCT_MOB.Name decoded as Latin-1
  int32 mob_level = 3;      // STRUCT_MOB.CurrentScore.Level
  repeated MobDropItem items = 4;
}

message ListMobDropsRequest {
  int64 moderator_id = 1;
  string mob_query = 2;   // substring match on mob/template name
  int32 item_index = 3;   // 0 = no exact item filter
  string item_query = 4;  // substring match on item name or index
}

message ListMobDropsResponse {
  AdminResult result = 1;
  repeated MobDropEntry mobs = 2;
}

// ItemPrice is a global per-item price override (item_price table); an item
// absent from ListItemPrices uses the content catalog's base price.
message ItemPrice {
  int32 item_index = 1;
  int64 price = 2;
}

message ListItemPricesRequest { int64 moderator_id = 1; }
message ListItemPricesResponse {
  AdminResult result = 1;
  repeated ItemPrice prices = 2;
}

// MapZone is one of the fixed city zones (tmserver/internal/world/city.go's
// cities table). Label only, for the map_id picker — the world runs a single
// grid, so map_id itself has no gameplay effect today.
message MapZone {
  int32 id = 1;
  string name = 2;
}

message ListMapZonesRequest { int64 moderator_id = 1; }
message ListMapZonesResponse {
  AdminResult result = 1;
  repeated MapZone zones = 2;
}

// MobTemplateAdminService is the moderator-facing mob/NPC template STAT editing
// surface (mob-template-editing-plan.md) — the equivalent-tool successor to the
// legacy Win32 EDITAPPMOB. It is the sibling of NpcAdminService: that service
// edits spawn position/visibility/shop for the DB-managed merchant subset; this
// one edits the combat/attribute stats (Level/HP/MP/attributes/EXP/skills/
// equip) of ANY npc/<template_name> file, monsters included. Same conventions:
// every request carries moderator_id, re-authorized server-side against
// account.role, and all writes are cold config in Postgres — the tmServer only
// ever reads it, once at boot (no hot-reload for this feature, matching
// EDITAPPMOB's own restart-to-apply behavior).
service MobTemplateAdminService {
  // ListMobTemplates returns every STRUCT_MOB template file found in the
  // content tree (Release/TMsrv/run/npc/) — unlike NpcAdminService's
  // ListMerchantTemplates, this is NOT filtered to merchants: monsters are the
  // primary rebalancing use case for this tool.
  rpc ListMobTemplates(ListMobTemplatesRequest) returns (ListMobTemplatesResponse);
  // GetMobTemplateStat returns the stat override for a template if one exists;
  // otherwise it reads the raw template file's current values (read-through),
  // so opening the editor for an untouched template shows real starting
  // values instead of zeros.
  rpc GetMobTemplateStat(GetMobTemplateStatRequest) returns (GetMobTemplateStatResponse);
  // UpsertMobTemplateStat creates or replaces the full stat override for a
  // template_name.
  rpc UpsertMobTemplateStat(UpsertMobTemplateStatRequest) returns (UpsertMobTemplateStatResponse);
  // SetMobTemplateEquip replaces a template's Equip[] slot overrides. Requires
  // a stat override to already exist for template_name (same dependency as
  // NpcAdminService.SetNpcShop on the NPC definition existing).
  rpc SetMobTemplateEquip(SetMobTemplateEquipRequest) returns (AdminAck);
  // DeleteMobTemplateStat removes the override, reverting the template to its
  // raw file defaults (never deletes the underlying file — Release/ is
  // read-only in production).
  rpc DeleteMobTemplateStat(DeleteMobTemplateStatRequest) returns (AdminAck);
}

// MobTemplateFile is one STRUCT_MOB template found under Release/TMsrv/run/npc/,
// unfiltered (see ListMobTemplates).
message MobTemplateFile {
  string template_name = 1; // exact value for Upsert/GetMobTemplateStat.template_name
  string display_name = 2;  // the template's mob.Name, for the picker UI
  int32 merchant = 3;       // CurrentScore.Merchant, informational
}

message ListMobTemplatesRequest { int64 moderator_id = 1; }
message ListMobTemplatesResponse {
  AdminResult result = 1;
  repeated MobTemplateFile templates = 2;
}

// AdminMobTemplateEquipItem is one Equip[] slot override (0..15, MAX_EQUIP).
message AdminMobTemplateEquipItem {
  int32 slot = 1;
  int32 item_index = 2;
  int32 eff1 = 3;  int32 effv1 = 4;
  int32 eff2 = 5;  int32 effv2 = 6;
  int32 eff3 = 7;  int32 effv3 = 8;
}

// AdminMobTemplateStat is the full moderator-editable field surface of a mob
// template — the fields the legacy EDITAPPMOB edited, minus Carry[] (already
// AdminNpcShopItem) and DB-managed spawn position (already AdminNpc).
// BaseScore/CurrentScore are not modeled separately: tmServer mirrors the same
// value into both, matching EDITAPPMOB's own `CurrentScore = BaseScore` on
// save.
message AdminMobTemplateStat {
  string template_name = 1;
  // overridden is false when this is a read-through of the raw template
  // file's current values (no saved override yet) — GetMobTemplateStat only.
  bool overridden = 2;
  string display_name = 3;  // "" keeps the template file's own name
  int32 clan = 4;
  int32 merchant = 5;  // STRUCT_MOB top-level Merchant — distinct from AdminNpc.merchant
  int32 class = 6;
  int32 coin = 7;
  int64 exp = 8;
  int32 spx = 9;
  int32 spy = 10;
  int32 level = 11;
  int32 ac = 12;
  int32 damage = 13;
  int32 chaos_rate = 14;
  int32 attack_run = 15;
  int32 direction = 16;
  int32 str = 17;
  int32 intel = 18;  // "int" avoided (reserved in several target languages)
  int32 dex = 19;
  int32 con = 20;
  int32 special1 = 21;
  int32 special2 = 22;
  int32 special3 = 23;
  int32 special4 = 24;
  int32 max_hp = 25;
  int32 hp = 26;
  int32 max_mp = 27;
  int32 mp = 28;
  int32 learned_skill = 29;
  int32 score_bonus = 30;
  int32 skill_bar1 = 31;
  int32 skill_bar2 = 32;
  int32 skill_bar3 = 33;
  int32 skill_bar4 = 34;
  int32 regen_hp = 35;
  int32 regen_mp = 36;
  int32 resist1 = 37;
  int32 resist2 = 38;
  int32 resist3 = 39;
  int32 resist4 = 40;
  repeated AdminMobTemplateEquipItem equip = 41;
}

message GetMobTemplateStatRequest {
  int64 moderator_id = 1;
  string template_name = 2;
}
message GetMobTemplateStatResponse {
  AdminResult result = 1;
  AdminMobTemplateStat stat = 2;
  // file_stat is the template FILE's own values, sent alongside stat whenever an
  // override exists — so an editor can show what was changed and what is still
  // the shipped default. Absent when there is no override (stat already IS the
  // file) or when the file cannot be read.
  //
  // Without it "exceção salva" is all anyone knows: the screen cannot say which
  // of the thirty-odd numbers somebody edited, and undoing one field means
  // discarding the whole override.
  AdminMobTemplateStat file_stat = 3;
  // origins is where NPCGener.txt spawns this template, one entry per named
  // place, busiest first. Empty means no generator block names it — which is
  // true of two thirds of the 1991 template files, including @@Gargula, sitting
  // in the picker right beside the Gargula_ somebody rebalancing "the gargoyle"
  // actually meant. It is NOT proof nothing spawns the template: instances,
  // quests and summons create mobs by name from code.
  repeated AdminMobOrigin origins = 4;
}

// AdminMobOrigin is one place a template spawns, aggregated over every generator
// block that names it there — the busier templates hold dozens of blocks a few
// tiles apart, which is one place to a person and forty rows on a screen.
message AdminMobOrigin {
  // place is the name to show, already translated ("Água Místico", "Dungeon 2º
  // Andar", "Campo — perto de Erion").
  string place = 1;
  // points is how many generator blocks spawn the template here, counting the
  // blocks where it is the follower as well as the leader.
  int32 points = 2;
  // amount sums MaxNumMob over the blocks where this template LEADS. A
  // follower's count belongs to its leader's block, so counting it here would
  // report twice the population that actually stands there.
  int32 amount = 3;
  // respawn_minutes is the shortest respawn period among those blocks. Zero
  // means none of them regenerate — the legacy reads MinuteGenerate<=0 as
  // spawn-once, which is how the instanced dungeons are written.
  int32 respawn_minutes = 4;
  // x, y is one representative spawn point, for a moderator who wants to go look.
  int32 x = 5;
  int32 y = 6;
}

message UpsertMobTemplateStatRequest {
  int64 moderator_id = 1;
  AdminMobTemplateStat stat = 2;
}
message UpsertMobTemplateStatResponse {
  AdminResult result = 1;
}

message SetMobTemplateEquipRequest {
  int64 moderator_id = 1;
  string template_name = 2;
  repeated AdminMobTemplateEquipItem items = 3;
}

message DeleteMobTemplateStatRequest {
  int64 moderator_id = 1;
  string template_name = 2;
}

// AttributeMapAdminService is the moderator-facing replacement for the legacy
// Source/Code/AttributeMap_Editor tool. It reads the binary
// Release/TMsrv/run/AttributeMap.dat asset, applies bulk transformations, and
// returns a new .dat payload for controlled operator replacement. It never
// mutates live tmServer state; the game consumes AttributeMap.dat at boot.
service AttributeMapAdminService {
  // GetAttributeMapInfo returns dimensions, known attribute meanings, a value
  // histogram, and the SHA-256 of the currently configured AttributeMap.dat.
  rpc GetAttributeMapInfo(GetAttributeMapInfoRequest) returns (GetAttributeMapInfoResponse);
  // TransformAttributeMap applies one bulk rule to AttributeMap.dat and returns
  // the transformed binary as AttributeMap_New.dat. Source files are not
  // overwritten by this RPC.
  rpc TransformAttributeMap(TransformAttributeMapRequest) returns (TransformAttributeMapResponse);
}

message GetAttributeMapInfoRequest { int64 moderator_id = 1; }
message GetAttributeMapInfoResponse {
  AdminResult result = 1;
  AttributeMapInfo info = 2;
}

message AttributeMapInfo {
  int32 dim = 1;         // 1024 cells per side
  int32 world_scale = 2; // one attribute cell covers a 4x4 world block
  string sha256 = 3;
  repeated AttributeMapValueCount histogram = 4;
  repeated AttributeMapMeaning meanings = 5;
}

message AttributeMapValueCount {
  int32 value = 1; // byte value, 0..255
  int64 count = 2;
}

message AttributeMapMeaning {
  int32 value = 1;       // exact value or bit mask
  string name = 2;       // short UI label
  string description = 3;
  bool bit = 4;          // true when value is a bit mask
}

enum AttributeMapTransformOperation {
  ATTRIBUTE_MAP_TRANSFORM_OPERATION_UNSPECIFIED = 0;
  // Exact legacy AttributeMap_Editor rule:
  // if value < 64 && value != 1 { value |= 64 }.
  ATTRIBUTE_MAP_TRANSFORM_OPERATION_LEGACY_MARK_PVP_EXP_LOSS = 1;
  ATTRIBUTE_MAP_TRANSFORM_OPERATION_ASSIGN_VALUE = 2;
  ATTRIBUTE_MAP_TRANSFORM_OPERATION_SET_BITS = 3;
  ATTRIBUTE_MAP_TRANSFORM_OPERATION_CLEAR_BITS = 4;
  ATTRIBUTE_MAP_TRANSFORM_OPERATION_TOGGLE_BITS = 5;
}

// AttributeMapRect is an inclusive world-coordinate rectangle. Coordinates are
// 0..4095; the service maps them to AttributeMap cells by x/4,y/4. Omit rect to
// transform the full map.
message AttributeMapRect {
  int32 min_x = 1;
  int32 min_y = 2;
  int32 max_x = 3;
  int32 max_y = 4;
}

// AttributeMapTransformFilter optionally restricts which cells inside the
// rectangle are modified. With mask == 0 it matches exact_value. With mask != 0
// it matches (value & mask) == (match_value & mask).
message AttributeMapTransformFilter {
  bool enabled = 1;
  int32 exact_value = 2; // 0..255; usable because enabled carries presence
  int32 mask = 3;        // 0..255
  int32 match_value = 4; // 0..255
}

message TransformAttributeMapRequest {
  int64 moderator_id = 1;
  AttributeMapTransformOperation operation = 2;
  int32 operand = 3; // assigned byte or bit mask, 0..255; ignored by legacy op
  AttributeMapRect rect = 4;
  AttributeMapTransformFilter filter = 5;
}

message TransformAttributeMapResponse {
  AdminResult result = 1;
  int32 changed_count = 2;
  repeated AttributeMapValueCount before_histogram = 3;
  repeated AttributeMapValueCount after_histogram = 4;
  string original_sha256 = 5;
  string new_sha256 = 6;
  string filename = 7; // suggested download name: AttributeMap_New.dat
  bytes data = 8;      // full transformed 1024x1024 binary
}

// DonateAdminService is the moderator-facing donate web-shop surface (issue #34):
// CRUD over the donate_shop_item catalog plus the manual "credit donate to an
// account" path (the seam the future payment webhook reuses). Like NpcAdminService
// every request carries the moderator's account_id, re-authorized server-side
// against account.role; all writes are cold config in Postgres, never live state.
service DonateAdminService {
  // ListShopItems returns every offer (enabled or not) — the moderation table.
  rpc ListShopItems(ListShopItemsRequest) returns (ListShopItemsResponse);
  // UpsertShopItem creates (id==0) or updates an offer.
  rpc UpsertShopItem(UpsertShopItemRequest) returns (UpsertShopItemResponse);
  // SetShopItemEnabled toggles whether an offer is on sale.
  rpc SetShopItemEnabled(SetShopItemEnabledRequest) returns (AdminAck);
  // DeleteShopItem removes an offer.
  rpc DeleteShopItem(DeleteShopItemRequest) returns (AdminAck);
  // CreditDonateBalance adds donate currency to an account's wallet. This is the
  // "adicionar donate na conta" function; the payment webhook will later call the
  // same underlying store method after settling a real-money donation.
  rpc CreditDonateBalance(CreditDonateBalanceRequest) returns (CreditDonateBalanceResponse);
}

// DonateShopItem is one purchasable offer: an item (index + up to three
// effect/value pairs) sold for `price` units of donate currency. expires_days > 0
// makes the delivered item timed.
message DonateShopItem {
  int64 id = 1;
  int32 item_index = 2;
  int32 eff1 = 3;  int32 effv1 = 4;
  int32 eff2 = 5;  int32 effv2 = 6;
  int32 eff3 = 7;  int32 effv3 = 8;
  int32 price = 9;
  string title = 10;
  string description = 11;
  bool enabled = 12;
  int32 expires_days = 13;
}

message ListShopItemsRequest { int64 moderator_id = 1; }
message ListShopItemsResponse {
  AdminResult result = 1;
  repeated DonateShopItem items = 2;
}

message UpsertShopItemRequest {
  int64 moderator_id = 1;
  // id == 0 creates a new offer; otherwise the offer with that id is updated.
  DonateShopItem item = 2;
}
message UpsertShopItemResponse {
  AdminResult result = 1;
  int64 item_id = 2;
}

message SetShopItemEnabledRequest {
  int64 moderator_id = 1;
  int64 item_id = 2;
  bool enabled = 3;
}

message DeleteShopItemRequest {
  int64 moderator_id = 1;
  int64 item_id = 2;
}

message CreditDonateBalanceRequest {
  int64 moderator_id = 1;
  int64 account_id = 2; // the account being credited
  int32 amount = 3;     // donate units to add (> 0)
  string reason = 4;    // free-text note recorded in the audit trail
}
message CreditDonateBalanceResponse {
  AdminResult result = 1;
  int32 new_balance = 2; // set only when result is OK
}

// DonateShopService is the player-facing donate shop the Next.js BFF calls with
// the logged account_id from its httpOnly session (never browser-supplied). It
// reads the enabled catalog and processes purchases: a purchase debits the
// account's donate balance and enqueues the item into delivery_queue, which the
// tmServer drains into the account cargo on the next login (web-platform-plan.md).
service DonateShopService {
  // ListShopItems returns the enabled offers (the vitrine).
  rpc ListShopItems(ListStoreItemsRequest) returns (ListStoreItemsResponse);
  // GetBalance returns the account's current donate balance.
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  // Buy purchases an offer for the account.
  rpc Buy(BuyRequest) returns (BuyResponse);
}

// BuyResult carries the purchase outcome in the body; only infra failures become
// gRPC errors.
enum BuyResult {
  BUY_RESULT_UNSPECIFIED = 0;
  BUY_RESULT_OK = 1;                 // debited + queued for delivery
  BUY_RESULT_INSUFFICIENT_FUNDS = 2; // balance < price
  BUY_RESULT_NOT_FOUND = 3;          // unknown offer or account
  BUY_RESULT_DISABLED = 4;           // offer exists but is not on sale
}

message ListStoreItemsRequest {}
message ListStoreItemsResponse {
  repeated DonateShopItem items = 1;
}

message GetBalanceRequest {
  int64 account_id = 1; // from the BFF session, never from browser input
}
message GetBalanceResponse {
  int32 balance = 1;
}

message BuyRequest {
  int64 account_id = 1;   // from the BFF session, never from browser input
  int64 shop_item_id = 2;
}
message BuyResponse {
  BuyResult result = 1;
  int32 new_balance = 2; // set only when result is OK
}

// DailyRewardAdminService is the moderator-facing daily-reward catalog surface
// (issue #35): CRUD over the daily_reward_item catalog. Like DonateAdminService
// every request carries the moderator's account_id, re-authorized server-side
// against account.role; all writes are cold config in Postgres, never live
// state. Unlike DonateAdminService there is no balance-credit RPC — daily
// rewards are free.
service DailyRewardAdminService {
  // ListRewardItems returns every offer (enabled or not) — the moderation table.
  rpc ListRewardItems(ListRewardItemsRequest) returns (ListRewardItemsResponse);
  // UpsertRewardItem creates (id==0) or updates an offer.
  rpc UpsertRewardItem(UpsertRewardItemRequest) returns (UpsertRewardItemResponse);
  // SetRewardItemEnabled toggles whether an offer is claimable.
  rpc SetRewardItemEnabled(SetRewardItemEnabledRequest) returns (AdminAck);
  // DeleteRewardItem removes an offer.
  rpc DeleteRewardItem(DeleteRewardItemRequest) returns (AdminAck);
}

// DailyRewardItem is one claimable offer: an item (index + up to three
// effect/value pairs), free, gated only by the once-per-account-per-UTC-day
// limit. expires_days > 0 makes the delivered item timed.
message DailyRewardItem {
  int64 id = 1;
  int32 item_index = 2;
  int32 eff1 = 3;  int32 effv1 = 4;
  int32 eff2 = 5;  int32 effv2 = 6;
  int32 eff3 = 7;  int32 effv3 = 8;
  string title = 9;
  string description = 10;
  bool enabled = 11;
  int32 expires_days = 12;
}

message ListRewardItemsRequest { int64 moderator_id = 1; }
message ListRewardItemsResponse {
  AdminResult result = 1;
  repeated DailyRewardItem items = 2;
}

message UpsertRewardItemRequest {
  int64 moderator_id = 1;
  // id == 0 creates a new offer; otherwise the offer with that id is updated.
  DailyRewardItem item = 2;
}
message UpsertRewardItemResponse {
  AdminResult result = 1;
  int64 item_id = 2;
}

message SetRewardItemEnabledRequest {
  int64 moderator_id = 1;
  int64 item_id = 2;
  bool enabled = 3;
}

message DeleteRewardItemRequest {
  int64 moderator_id = 1;
  int64 item_id = 2;
}

// WorldEventAdminService is the moderator-facing global event control surface
// (issue #116). The portal writes this cold config; tmServer polls it through
// dbServer and applies it inside the single-owner loop.
service WorldEventAdminService {
  // GetWorldEventConfig returns the current global event settings.
  rpc GetWorldEventConfig(GetWorldEventConfigRequest) returns (GetWorldEventConfigResponse);
  // SetWorldEventConfig replaces the event settings.
  rpc SetWorldEventConfig(SetWorldEventConfigRequest) returns (AdminAck);
}

message WorldEventConfig {
  bool enabled = 1;
  int32 item_index = 2;
  int32 rate = 3;
  int32 start_index = 4;
  int32 current_index = 5;
  int32 end_index = 6;
  bool indexed = 7;
  bool notice_enabled = 8;
  bool double_exp_enabled = 9;
  bool newbie_event_enabled = 10;
  // When FALSE every PvE reward is halved (expreward.go step 11). Legacy
  // KefraLive=0, which is what this server has always run.
  bool kefra_live_enabled = 11;
  // The daily Tower War (migration 0051): on/off and the hour (0..23, server
  // time) it starts. `optional` so presence is visible: on a read, absent means
  // a webServer too old to send them; on SetWorldEventConfig, absent means a
  // caller that does not know about them, and the stored values are kept
  // rather than reset.
  optional bool tower_war_enabled = 12;
  optional int32 tower_war_hour = 13;
  // How long a lone boss takes to come back, in hours (migration 0056, 1..168).
  // Like the Tower War pair: on SetWorldEventConfig, absent keeps the stored
  // value rather than resetting it.
  optional int32 boss_respawn_hours = 14;
  // The Mortal round XP cap (migration 0073), one value per level band
  // (99/199/299/349/398), without and with the double-XP event. On
  // SetWorldEventConfig anything but five values keeps what is stored, like the
  // optional fields above. Zero in a band = no cap there.
  repeated int64 round_xp_cap = 15;
  repeated int64 round_xp_cap_double = 16;
}

message GetWorldEventConfigRequest { int64 moderator_id = 1; }
message GetWorldEventConfigResponse {
  AdminResult result = 1;
  int64 version = 2;
  WorldEventConfig config = 3;
}

message SetWorldEventConfigRequest {
  int64 moderator_id = 1;
  WorldEventConfig config = 2;
}

// DailyRewardService is the player-facing daily reward surface the Next.js BFF
// calls with the logged account_id from its httpOnly session (never
// browser-supplied). A claim inserts a daily_reward_claim row for today's UTC
// calendar day and enqueues the item into delivery_queue, which the tmServer
// drains into the account cargo on the next login (web-platform-plan.md), the
// same pipe DonateShopService purchases use.
service DailyRewardService {
  // ListRewards returns the enabled offers (the vitrine).
  rpc ListRewards(ListRewardsRequest) returns (ListRewardsResponse);
  // GetClaimStatus reports whether the account already claimed today.
  rpc GetClaimStatus(GetClaimStatusRequest) returns (GetClaimStatusResponse);
  // Claim redeems one reward offer for the account for today.
  rpc Claim(ClaimRequest) returns (ClaimResponse);
}

// ClaimResult carries the claim outcome in the body; only infra failures
// become gRPC errors.
enum ClaimResult {
  CLAIM_RESULT_UNSPECIFIED = 0;
  CLAIM_RESULT_OK = 1;               // claim recorded + item queued for delivery
  CLAIM_RESULT_ALREADY_CLAIMED = 2;  // account already claimed today (UTC)
  CLAIM_RESULT_NOT_FOUND = 3;        // unknown offer or account
  CLAIM_RESULT_DISABLED = 4;         // offer exists but is not claimable
}

message ListRewardsRequest {}
message ListRewardsResponse {
  repeated DailyRewardItem items = 1;
}

message GetClaimStatusRequest {
  int64 account_id = 1; // from the BFF session, never from browser input
}
message GetClaimStatusResponse {
  bool claimed_today = 1;
  int64 claimed_item_id = 2;     // set only when claimed_today
  string claimed_item_title = 3; // set only when claimed_today (empty if the offer was since deleted)
}

message ClaimRequest {
  int64 account_id = 1;    // from the BFF session, never from browser input
  int64 reward_item_id = 2;
}
message ClaimResponse {
  ClaimResult result = 1;
}

// DonateTopupService is the payment-method-agnostic donate top-up surface the
// Next.js BFF calls server-side (never the browser). The portal owns no
// database: every durable order and the idempotency of the credit live here.
// PIX is the only method wired today, but the method is a FIELD of the order
// (payment_method), never part of an RPC or table name — credit card reuses the
// same RPCs and table later. The top-up credit happens INSIDE ConfirmTopupOrder,
// in the same transaction that flips the order to PAID and WITHOUT a moderator_id
// (unlike DonateAdminService.CreditDonateBalance), so a replayed webhook credits
// exactly once.
service DonateTopupService {
  // Payer profile (name + CPF), reused across a payer's top-ups.
  rpc GetPayerProfile(GetPayerProfileRequest) returns (GetPayerProfileResponse);
  rpc SavePayerProfile(SavePayerProfileRequest) returns (SavePayerProfileResponse);

  // CreateTopupOrder persists a PENDING order before the portal calls the
  // gateway (persist-before-provider). ConfirmTopupOrder credits the account
  // exactly once (idempotent on external_reference). GetTopupOrder is the poll.
  rpc CreateTopupOrder(CreateTopupOrderRequest) returns (CreateTopupOrderResponse);
  rpc ConfirmTopupOrder(ConfirmTopupOrderRequest) returns (ConfirmTopupOrderResponse);
  rpc GetTopupOrder(GetTopupOrderRequest) returns (GetTopupOrderResponse);

  // AttachTopupCharge records the gateway's OWN id for an order, so the server
  // can ask the processor about it later instead of waiting to be told.
  //
  // WHY IT EXISTS: until this call, a donation had exactly one path to being
  // credited — the gateway notifies the site, the site calls ConfirmTopupOrder.
  // A lost notification meant money charged and credits never given, with
  // nothing on the server able to notice, because the server had never seen the
  // gateway's id and cannot ask about a payment it cannot name.
  //
  // The site creates the donation charge itself and gets that id back. This
  // hands it over, and a sweep then polls the pending orders exactly the way the
  // marketplace already polls its charges. The notification stays the fast path;
  // the sweep is the net underneath it.
  //
  // IDEMPOTENT, and refusing in two directions. The same order cannot be given a
  // DIFFERENT id, and the same id cannot be attached to a SECOND order — the
  // second refusal is the one that matters, because that is how one payment
  // would credit two orders.
  //
  // IT MUST NOT BREAK THE PURCHASE. If this call fails, the site shows the Pix
  // code anyway and logs: the player is in the middle of paying, and a failure
  // to set up our safety net is not a reason to refuse their money. What is lost
  // is the net under THAT order, and the count of orders without an id is what
  // makes that visible.
  rpc AttachTopupCharge(AttachTopupChargeRequest) returns (AttachTopupChargeResponse);
}

// PaymentMethod is the gateway a top-up is paid through. Extensible without
// breaking the contract — add new values at the end.
enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_PIX = 1;
  PAYMENT_METHOD_CREDIT_CARD = 2; // reserved; not yet used by the portal
}

// TopupResult is the outcome of ConfirmTopupOrder.
enum TopupResult {
  TOPUP_RESULT_UNSPECIFIED = 0;
  TOPUP_RESULT_CONFIRMED = 1;         // order was PENDING -> credited now
  TOPUP_RESULT_ALREADY_CONFIRMED = 2; // order was already PAID -> no-op (never re-credit)
  TOPUP_RESULT_NOT_FOUND = 3;         // external_reference does not exist
}

message AttachTopupChargeRequest {
  // The order, by the reference the server itself issued.
  string external_reference = 1;
  // The gateway's own id for the charge, exactly as it returned it. Opaque
  // here: nothing parses it, it only travels back to the processor as the name
  // of the payment to ask about.
  string gateway_identifier = 2;
}

// AttachResult says what happened, and every refusal is named.
//
// NAMED RATHER THAN A TRANSPORT ERROR because the caller has to be able to tell
// "I already did this" from "this is a bug in me". The first is normal on a
// retry; the second means one payment is about to be pointed at two orders, and
// it deserves an alert on the site's side rather than a line in a log.
enum AttachResult {
  ATTACH_RESULT_UNSPECIFIED = 0;
  // ATTACHED: stored now.
  ATTACH_RESULT_ATTACHED = 1;
  // ALREADY: this order already had exactly this id. A retry, and not a problem.
  ATTACH_RESULT_ALREADY = 2;
  // CONFLICT_ORDER: this order already has a DIFFERENT id. Nothing is changed —
  // the first id stays, because it is the one the charge was created with.
  ATTACH_RESULT_CONFLICT_ORDER = 3;
  // CONFLICT_IDENTIFIER: this id is already attached to ANOTHER order.
  //
  // THE REFUSAL THAT PROTECTS MONEY. Allowed, one paid transaction would satisfy
  // two pending orders and credit both, and the second set of credits comes out
  // of the server owner's pocket. It should never happen, which is exactly why
  // it is worth an alert and not a shrug.
  ATTACH_RESULT_CONFLICT_IDENTIFIER = 4;
  // NOT_FOUND: no order with that reference.
  ATTACH_RESULT_NOT_FOUND = 5;
  // ALREADY_PAID: the order is already credited. Nothing to attach: the sweep
  // only looks at pending orders, and re-pointing a settled order at a payment
  // has no honest meaning.
  ATTACH_RESULT_ALREADY_PAID = 6;
}

message AttachTopupChargeResponse {
  AttachResult result = 1;
}

// TopupStatus is the durable state of an order.
enum TopupStatus {
  TOPUP_STATUS_UNSPECIFIED = 0;
  TOPUP_STATUS_PENDING = 1;
  TOPUP_STATUS_PAID = 2;
}

message GetPayerProfileRequest  { int64 account_id = 1; }
message GetPayerProfileResponse { bool found = 1; string name = 2; string cpf = 3; }

message SavePayerProfileRequest  { int64 account_id = 1; string name = 2; string cpf = 3; }
message SavePayerProfileResponse { AdminResult result = 1; } // reuses AdminResult

message CreateTopupOrderRequest {
  int64         account_id = 1;
  string        external_reference = 2; // UUID generated by the portal (unique)
  int32         credits = 3;            // credits to add to donate_balance when paid
  int64         amount_cents = 4;       // amount charged, in cents (never float)
  PaymentMethod payment_method = 5;     // PIX for now
  // WHICH PACKAGE this is, by the id the site uses ("apoiador-supremo"). It is what
  // lets the server know what it promised, which it could not know before: credits
  // and amount_cents arrived already decided and were credited as they came.
  //
  // THE SERVER'S TABLE WINS. credits and amount_cents above are CHECKED against the
  // package's own row, and the order is refused when they disagree. The request comes
  // from the site's own BFF, and it is checked anyway: checking is cheap, and taking
  // back an item already delivered is not.
  //
  // An id that is not in the server's table is REFUSED, and not treated as a
  // giftless donation. An unknown id means the site and the server disagree about
  // what is on sale, and crediting regardless would hand out credits for a price
  // nobody checked. Failing while the person is still looking at the screen is the
  // cheap failure.
  //
  // Empty is accepted and means a donation with no package — every order created
  // before packages existed, and any future path that credits without selling a
  // package. Empty is not the same as unknown.
  //
  // Some packages are STAFF ONLY (the R$ 1,00 one that exists so the server's owner
  // can test a real payment). The site hides those, and the server refuses them for
  // an account that is not staff: hiding on a screen is not a lock, because the
  // screen is one door and this rpc is another.
  string package_id = 6;
}
message CreateTopupOrderResponse {
  AdminResult result = 1;
  int64 order_id = 2;
}

message ConfirmTopupOrderRequest  { string external_reference = 1; }
message ConfirmTopupOrderResponse {
  TopupResult result = 1;
  int64 new_balance = 2; // balance after crediting (or current balance if already-confirmed)
}

message GetTopupOrderRequest {
  string external_reference = 1;
  int64  account_id = 2; // owner; filters so one account cannot read another's order
}
message GetTopupOrderResponse {
  TopupStatus status = 1;
  int32 credits = 2;
  int64 new_balance = 3; // account balance when PAID; 0 otherwise
}

// DonateRevenueAdminService is the read-only revenue reporting surface behind the
// painel de faturamento. It answers "how much money came in this month, who paid,
// and where did the donate go", over data that has been persisted since
// 0008_donate_shop and 0010_donate_topup but had no read path until now.
//
// It is NOT bin.v1.BillingService: that is the login entitlement gate and, per
// web-platform-plan.md, explicitly not the cash wallet. This service reads
// donate_topup_order (real money), donate_shop_audit (wallet movements),
// account and donate_payer_profile.
//
// Like every *AdminService here, request field 1 is the caller's account id,
// re-authorized server-side against account.role ('moderator' or 'admin'). It
// writes NOTHING — not even an audit row — so it never interacts with the
// tmServer's single-owner loop.
//
// Money vs credits: *_cents is real BRL in integer cents; credits/*_credits is
// the in-game donate wallet unit. They are different units and must never be
// summed. Revenue is recognized on confirmed_at, never created_at: an order is
// only money once the gateway settled it.
//
// Time: every instant is int64 Unix SECONDS, matching db.v1's expires_at /
// updated_at_unix; web.v1 pulls in no google.protobuf well-known types and this
// service does not introduce that dependency. 0 means absent, so a PENDING order
// reports confirmed_at_unix = 0.
//
// Bucketing timezone: day/week/month buckets close in America/Sao_Paulo, so the
// panel agrees with a Brazilian bank statement. The instants on the wire are
// still absolute. See docs/integrations/faturamento-nextjs.md.
service DonateRevenueAdminService {
  // GetRevenueSummary returns the KPI header plus an optional gap-filled series.
  rpc GetRevenueSummary(GetRevenueSummaryRequest) returns (GetRevenueSummaryResponse);
  // ListTopupOrders is the paginated order table with the buyer identity already
  // joined in, so the BFF never fans out one account lookup per row.
  rpc ListTopupOrders(ListTopupOrdersRequest) returns (ListTopupOrdersResponse);
  // ListTopBuyers ranks accounts by revenue inside the window and carries the
  // all-time (LTV) aggregate alongside. Drill-down is ListTopupOrders or
  // ListDonateSpend with account_id set; there is no per-account RPC.
  rpc ListTopBuyers(ListTopBuyersRequest) returns (ListTopBuyersResponse);
  // ListDonateSpend is the donate wallet ledger over donate_shop_audit. It
  // normalizes that table's asymmetry: for action='purchase' the audit's
  // account_id column is the BUYER, but for action='credit_balance' it is the
  // MODERATOR and the credited account lives in after->>'account_id'. Each row
  // therefore reports subject (whose wallet moved) and actor (who caused it).
  rpc ListDonateSpend(ListDonateSpendRequest) returns (ListDonateSpendResponse);
  // SearchAccounts resolves a login prefix to account ids so the panel's filter
  // box and the top-buyer drill-down can work from a name the operator typed.
  rpc SearchAccounts(SearchAccountsRequest) returns (SearchAccountsResponse);
}

// RevenueWindow is the half-open [from_unix, to_unix) interval that scopes every
// read on this service. Both 0 = the last 30 days ending now; only to_unix 0 =
// now. The server rejects from >= to and any window wider than 366 days, and
// always resolves the window to a concrete bounded range before it reaches SQL.
message RevenueWindow {
  int64 from_unix = 1; // inclusive, Unix seconds; 0 = to_unix minus 30 days
  int64 to_unix   = 2; // exclusive, Unix seconds; 0 = now
}

// RevenueBucket is the time-series granularity. UNSPECIFIED skips the series
// entirely — the cheapest call, for a header-only refresh. An unrecognized value
// degrades to UNSPECIFIED rather than failing, so a newer portal cannot break an
// older server.
enum RevenueBucket {
  REVENUE_BUCKET_UNSPECIFIED = 0;
  REVENUE_BUCKET_DAY = 1;
  REVENUE_BUCKET_WEEK = 2;  // date_trunc('week') — ISO week, starts on MONDAY
  REVENUE_BUCKET_MONTH = 3;
}

// DonateLedgerAction filters the donate_shop_audit read. UNSPECIFIED returns both
// movement kinds; the catalog CRUD actions ('create'/'update'/'delete'/
// 'set_enabled') are never returned — they move no wallet.
enum DonateLedgerAction {
  DONATE_LEDGER_ACTION_UNSPECIFIED = 0;
  DONATE_LEDGER_ACTION_PURCHASE = 1; // donate_shop_audit.action = 'purchase'
  DONATE_LEDGER_ACTION_CREDIT   = 2; // donate_shop_audit.action = 'credit_balance'
}

// RevenueTotals is the KPI header. The first block is real money recognized on
// confirmed_at; the second is orders CREATED in the window (any status), the
// conversion denominator; the third is donate wallet flow, in CREDITS, not money.
message RevenueTotals {
  int64 paid_orders     = 1;
  int64 gross_cents     = 2; // serialize as string in public JSON
  int64 credits_sold    = 3;
  int64 distinct_buyers = 4;

  int64 created_orders  = 5; // created in the window, any status
  int64 pending_orders  = 6; // created in the window and still PENDING today
  int64 pending_cents   = 7; // string in public JSON; NOT revenue, never add to gross_cents

  int64 shop_purchases  = 8;  // donate_shop_audit rows with action='purchase'
  int64 credits_spent   = 9;  // sum of after->>'price' over those rows
  int64 manual_credits  = 10; // rows with action='credit_balance' (moderator grants)
  int64 credits_granted = 11; // sum of after->>'amount' over those rows
}

// RevenueByMethod breaks recognized revenue down by gateway. Repeated rather than
// fixed pix_/card_ fields so adding a PaymentMethod never changes this message.
message RevenueByMethod {
  PaymentMethod payment_method = 1;
  int64 paid_orders = 2;
  int64 gross_cents = 3; // serialize as string in public JSON
}

// RevenuePoint is one bucket of the series. Buckets with no orders ARE returned
// with zeroes, so the chart axis is continuous and the front-end never gap-fills.
message RevenuePoint {
  int64 bucket_start_unix = 1; // instant the bucket opens (America/Sao_Paulo boundary)
  int64 paid_orders       = 2;
  int64 gross_cents       = 3; // serialize as string in public JSON
  int64 credits_sold      = 4;
  int64 distinct_buyers   = 5;
}

message GetRevenueSummaryRequest {
  int64 moderator_id = 1;
  RevenueWindow window = 2;
  RevenueBucket bucket = 3;
  int64 account_id = 4; // 0 = all accounts; set for the per-account drill-down
}
message GetRevenueSummaryResponse {
  AdminResult result = 1;
  RevenueTotals totals = 2;
  repeated RevenueByMethod by_method = 3;
  repeated RevenuePoint series = 4; // empty when bucket is UNSPECIFIED
  int64 from_unix = 5; // the window the server actually applied, after defaults
  int64 to_unix   = 6; // echo it back so the UI can label the period truthfully
}

// TopupOrderRow is one row of the order table, with the buyer identity resolved
// server-side in the same SQL (a JOIN, never N+1 lookups from the BFF).
message TopupOrderRow {
  int64  id = 1;                 // serialize as string in public JSON
  string external_reference = 2; // the portal UUID — the reconciliation key
  int64  account_id = 3;         // serialize as string in public JSON
  string account_name = 4;       // account.name (canonical lowercase login)
  string account_email = 5;
  string payer_name = 6;         // donate_payer_profile; empty when never filled
  // ALWAYS masked (***.456.789-**). The raw 11 digits never leave the web-api:
  // 'moderator' is a coarse role and a revenue report has no use for the full
  // number — a chargeback is reconciled by external_reference.
  string payer_cpf_masked = 7;
  int32  credits = 8;
  int64  amount_cents = 9;       // serialize as string in public JSON
  PaymentMethod payment_method = 10;
  // ALWAYS empty today: CreateTopupOrder never writes donate_topup_order.provider.
  // Do not build UI on it.
  string provider = 11;
  TopupStatus status = 12;
  int64  created_at_unix = 13;
  int64  confirmed_at_unix = 14; // 0 while PENDING
}

message ListTopupOrdersRequest {
  int64 moderator_id = 1;
  RevenueWindow window = 2;
  // status also picks the date column the window filters on: PAID filters and
  // orders by confirmed_at (revenue recognition); anything else uses created_at.
  TopupStatus status = 3;           // UNSPECIFIED = any status
  PaymentMethod payment_method = 4; // UNSPECIFIED = any method
  int64 account_id = 5;             // 0 = all accounts
  int32 limit = 6;                  // default 50, max 100
  int32 offset = 7;                 // negative values are treated as 0
}
message ListTopupOrdersResponse {
  AdminResult result = 1;
  repeated TopupOrderRow orders = 2;
  int32 total_count = 3;
  int64 from_unix = 4;
  int64 to_unix   = 5;
}

// TopBuyerRow carries both the window aggregate (what the panel ranks on) and the
// all-time aggregate (the LTV), because "who spent most this month" and "who is
// worth most overall" are different questions and the panel shows both.
message TopBuyerRow {
  int64  account_id = 1; // serialize as string in public JSON
  string account_name = 2;
  string account_email = 3;
  int64  window_paid_orders   = 4;
  int64  window_gross_cents   = 5; // string in public JSON; the ranking key
  int64  lifetime_paid_orders = 6;
  int64  lifetime_gross_cents = 7; // string in public JSON; the LTV
  int64  lifetime_credits     = 8;
  int64  first_paid_at_unix   = 9;  // all-time, not window-scoped
  int64  last_paid_at_unix    = 10; // all-time, not window-scoped
  int32  donate_balance       = 11; // current wallet — point-in-time, not a window value
}
message ListTopBuyersRequest {
  int64 moderator_id = 1;
  RevenueWindow window = 2;
  int32 limit = 3;  // default 50, max 100
  int32 offset = 4; // negative values are treated as 0
}
message ListTopBuyersResponse {
  AdminResult result = 1;
  repeated TopBuyerRow buyers = 2;
  int32 total_count = 3; // distinct accounts that paid inside the window
  int64 from_unix = 4;
  int64 to_unix   = 5;
}

// DonateLedgerRow is one donate wallet movement. credits_delta is SIGNED so the
// column sums to a meaningful net: negative for a purchase (debit), positive for
// a moderator credit. It is in donate credits, never money.
message DonateLedgerRow {
  int64  id = 1; // donate_shop_audit.id; string in public JSON
  DonateLedgerAction action = 2;
  int64  created_at_unix = 3;
  int64  subject_account_id = 4; // whose wallet moved; string in public JSON
  string subject_account_name = 5;
  int64  actor_account_id = 6;   // == subject on a purchase, the MODERATOR on a credit
  string actor_account_name = 7;
  int64  credits_delta = 8;      // signed: -price on purchase, +amount on credit
  int64  balance_after = 9;      // wallet balance recorded at the time
  int64  shop_item_id = 10;      // 0 for credit_balance; string in public JSON
  // Empty when the offer was deleted since the purchase (shop_item_id is
  // deliberately not an FK, so history survives). Fall back to shop_item_id.
  string shop_item_title = 11;
  string reason = 12; // credit_balance only; the moderator's note
}
message ListDonateSpendRequest {
  int64 moderator_id = 1;
  RevenueWindow window = 2;
  DonateLedgerAction action = 3; // UNSPECIFIED = both movement kinds
  int64 account_id = 4;          // matched against the SUBJECT, not the raw audit column
  int32 limit = 5;               // default 50, max 100
  int32 offset = 6;              // negative values are treated as 0
}
message ListDonateSpendResponse {
  AdminResult result = 1;
  repeated DonateLedgerRow entries = 2;
  int32 total_count = 3;
  int64 from_unix = 4;
  int64 to_unix   = 5;
}

// AccountSummary is the minimum identity the panel needs to turn a typed login
// into an account_id filter. It exposes no credentials.
message AccountSummary {
  int64  id = 1; // serialize as string in public JSON
  string name = 2;
  string email = 3;
  int32  donate_balance = 4;
  string role = 5; // 'player' | 'moderator' | 'admin'
  bool   is_blocked = 6;
}
message SearchAccountsRequest {
  int64  moderator_id = 1;
  string name_prefix = 2; // canonicalized to lowercase server-side; minimum 2 chars
  int32  limit = 3;       // default 20, max 50
}
message SearchAccountsResponse {
  AdminResult result = 1;
  repeated AccountSummary accounts = 2;
}

// ItemStatAdminService is the moderator-facing item base stat editor
// (0023_item_stats), the item-side sibling of MobTemplateAdminService. It edits
// cold config in Postgres — what a catalog item requires to equip and the
// effects it grants — never live game state.
//
// The tmServer applies an edit only at its next boot, because these numbers feed
// the equip score model, which is recomputed per character: swapping them under
// a running server would leave two players wearing the same item with different
// stats. Item PRICE, edited through NpcAdminService.SetItemPrice, is the
// contrast — it hot-reloads within ~15s, because a price is only read at the
// moment of a shop transaction.
service ItemStatAdminService {
  // GetItemStat returns an item's override, or a read-through of the catalog's
  // own numbers when it has none, so an editor never opens on zeros. Saving a
  // zeroed form would strip the item, since an override replaces the whole
  // effect list rather than merging into it.
  rpc GetItemStat(GetItemStatRequest) returns (GetItemStatResponse);
  // UpsertItemStat writes the override whole.
  rpc UpsertItemStat(UpsertItemStatRequest) returns (AdminAck);
  // DeleteItemStat drops the override so ItemList.csv applies again.
  rpc DeleteItemStat(DeleteItemStatRequest) returns (AdminAck);
}

message AdminItemStat {
  int32 item_index = 1;
  // overridden is false when this is a read-through of the catalog's current
  // values (no saved override yet) — GetItemStat only.
  bool overridden = 2;
  // display_name is the catalog name, for the UI. Read-only: an item's name
  // lives in ItemList.csv and is not part of the override.
  string display_name = 3;
  int32 req_level = 4;  // requirement to equip: ItemList.csv "Lvl.Str.Int.Dex.Con"
  int32 req_str = 5;
  int32 req_int = 6;
  int32 req_dex = 7;
  int32 req_con = 8;
  int32 damage = 9;  // combat
  int32 damageadd = 10;
  int32 ac = 11;
  int32 acadd = 12;
  int32 magic = 13;
  int32 magicadd = 14;
  int32 critical = 15;
  int32 critical2 = 16;
  int32 runspeed = 17;
  int32 str = 18;  // attributes
  int32 intel = 19;  // "int" is reserved in several targets
  int32 dex = 20;
  int32 con = 21;
  int32 hp = 22;  // life
  int32 hpadd = 23;
  int32 hpadd2 = 24;
  int32 mp = 25;
  int32 mpadd = 26;
  int32 mpadd2 = 27;
  int32 resist1 = 28;  // resistances
  int32 resist2 = 29;
  int32 resist3 = 30;
  int32 resist4 = 31;
  int32 resistall = 32;
  int32 special1 = 33;  // masteries
  int32 special2 = 34;
  int32 special3 = 35;
  int32 special4 = 36;
  int32 specialall = 37;
  int32 itemlevel = 38;  // identity and mechanics — carried so a save cannot strip them
  int32 itemtype = 39;
  int32 mobtype = 40;
  int32 wtype = 41;
  int32 pos = 42;
  int32 sanc = 43;
  int32 nosanc = 44;
  int32 incubate = 45;
  int32 incudelay = 46;
  // Reach (read at mob spawn) and the use-item class. Neither folds into the
  // equip score, which is why they are not among the effect columns above.
  int32 ef_range = 47;
  int32 ef_volatile = 48;
}

message GetItemStatRequest {
  int64 moderator_id = 1;
  int32 item_index = 2;
}
message GetItemStatResponse {
  AdminResult result = 1;
  AdminItemStat stat = 2;
}

message UpsertItemStatRequest {
  int64 moderator_id = 1;
  AdminItemStat stat = 2;
}

message DeleteItemStatRequest {
  int64 moderator_id = 1;
  int32 item_index = 2;
}

// MountGrowthAdminService edits what the staff panel can decide about a mount
// lineage. Two things live here, because they are two columns of one screen:
//
//   - the growth curve (0030_mount_growth_rate) — the chance an âmago raises an
//     ADULT mount one level, per band of twenty levels;
//   - the absorption pair (0035_mount_absorb) — how much of a hit the mount eats
//     instead of its owner, against a player and against a monster.
//
// Writes are whole-object on both: the six bands are read together and only make
// sense together, and the two absorption numbers are the two halves of one
// decision about what the mount is for. A save that landed half of either would
// leave a lineage nobody designed.
service MountGrowthAdminService {
  // ListMountGrowthCurves returns every adult lineage, configured or not, so the
  // list screen can show the whole roster rather than only what someone has
  // already touched.
  rpc ListMountGrowthCurves(ListMountGrowthCurvesRequest) returns (ListMountGrowthCurvesResponse);
  // SetMountGrowthCurve writes one lineage's six bands.
  rpc SetMountGrowthCurve(SetMountGrowthCurveRequest) returns (AdminAck);
  // ClearMountGrowthCurve drops the lineage's rows so the compiled default
  // applies again. Restoring is a delete, not a write of the default values:
  // absence is what "not configured" means everywhere in this overlay.
  rpc ClearMountGrowthCurve(ClearMountGrowthCurveRequest) returns (AdminAck);

  // ListMountAbsorb returns every adult lineage's absorption pair, configured or
  // not, for the same reason the curve list does: the question an operator has is
  // "which mounts are still on the default?", and a list of only what someone
  // touched cannot answer it.
  rpc ListMountAbsorb(ListMountAbsorbRequest) returns (ListMountAbsorbResponse);
  // SetMountAbsorb writes one lineage's two numbers.
  rpc SetMountAbsorb(SetMountAbsorbRequest) returns (AdminAck);
  // ClearMountAbsorb drops the lineage's row so the compiled default (25/25, the
  // legacy) applies again.
  rpc ClearMountAbsorb(ClearMountAbsorbRequest) returns (AdminAck);

  // ListMountBonus returns every adult lineage's attributes — attack, magic,
  // evasion, immunity — configured or not, each beside its compiled default, so
  // the screen can show what a lineage had before anyone touched it.
  rpc ListMountBonus(ListMountBonusRequest) returns (ListMountBonusResponse);
  // SetMountBonus writes one lineage's four numbers.
  rpc SetMountBonus(SetMountBonusRequest) returns (AdminAck);
  // ClearMountBonus drops the lineage's row so the compiled table applies again.
  rpc ClearMountBonus(ClearMountBonusRequest) returns (AdminAck);

  // MountConfigVersion is when the mount overlay last changed, as unix seconds.
  // The panel holds it against the number the running game reports, which is the
  // only way the screen can say whether what it shows is what players get.
  rpc MountConfigVersion(MountConfigVersionRequest) returns (MountConfigVersionResponse);
}

message AdminMountGrowthCurve {
  int32 mount_index = 1;   // the ADULT mount, 2360..2389
  string display_name = 2; // catalog name, read-only
  int32 cria_index = 3;    // the cria this mount grows from
  int32 amago_index = 4;   // the âmago that feeds it — not always this row's own
  // configured is false when no band has been set and the compiled default
  // applies to the whole lineage.
  bool configured = 5;
  // rates has one entry per band (0 = levels 1..20). A band nobody configured
  // carries -1, which is NOT the same as 0: zero is a legitimate setting, an
  // operator deliberately making that band impossible.
  repeated int32 rates = 6;
}

message ListMountGrowthCurvesRequest {}
message ListMountGrowthCurvesResponse {
  repeated AdminMountGrowthCurve curves = 1;
}

message SetMountGrowthCurveRequest {
  int64 moderator_id = 1;
  string moderator = 2;
  int32 mount_index = 3;
  repeated int32 rates = 4; // one per band, 0..100
}

message ClearMountGrowthCurveRequest {
  int64 moderator_id = 1;
  int32 mount_index = 2;
}

// AdminMountAbsorb is one lineage's absorption as the panel shows it: how much
// of a hit the mount eats instead of its owner, against a player and against a
// monster.
//
// configured is false when nobody has set this lineage and the compiled default
// applies to both numbers. It is a separate flag rather than a sentinel in the
// values because 0 is a legitimate setting — a mount deliberately made to
// absorb nothing on one axis — and the two must not collapse.
message AdminMountAbsorb {
  int32 mount_index = 1;
  string display_name = 2; // catalog name, read-only
  bool configured = 3;
  int32 absorb_pvp = 4; // 0..100, meaningful only when configured
  int32 absorb_pve = 5;
}

message MountConfigVersionRequest {}
message MountConfigVersionResponse { int64 version = 1; }

message ListMountAbsorbRequest {}
message ListMountAbsorbResponse {
  repeated AdminMountAbsorb absorb = 1;
}

message SetMountAbsorbRequest {
  int64 moderator_id = 1;
  string moderator = 2;
  int32 mount_index = 3;
  int32 absorb_pvp = 4; // 0..100
  int32 absorb_pve = 5; // 0..100
}

message ClearMountAbsorbRequest {
  int64 moderator_id = 1;
  int32 mount_index = 2;
}

// AdminMountBonus is one lineage's attributes as the panel shows it. The
// default_* fields are the compiled table (the client's own numbers), sent
// always, so the screen can say "was 32, now 40" and so restoring is a visible
// change. attack/magic/evasion/resist are what is in effect: the configured
// values when configured, the defaults otherwise.
message AdminMountBonus {
  int32 mount_index = 1;
  string display_name = 2; // catalog name, read-only
  bool configured = 3;
  int32 attack = 4;  // coefficient: (level+20)*attack/100
  int32 magic = 5;   // coefficient: (level+15)*magic/100
  int32 evasion = 6; // tenths of a percent
  int32 resist = 7;
  int32 default_attack = 8;
  int32 default_magic = 9;
  int32 default_evasion = 10;
  int32 default_resist = 11;
}

message ListMountBonusRequest {}
message ListMountBonusResponse {
  repeated AdminMountBonus bonus = 1;
}

message SetMountBonusRequest {
  int64 moderator_id = 1;
  string moderator = 2;
  int32 mount_index = 3;
  int32 attack = 4;  // 0..2000
  int32 magic = 5;   // 0..500
  int32 evasion = 6; // 0..100, tenths of a percent
  int32 resist = 7;  // 0..100
}

message ClearMountBonusRequest {
  int64 moderator_id = 1;
  int32 mount_index = 2;
}
