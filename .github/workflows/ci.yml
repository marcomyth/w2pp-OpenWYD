name: CI

on:
  push:
    # A preview e o ambiente de teste do Railway (teste-xp-grupo), com "Wait for
    # CI" ligado: ele so faz deploy depois que as checagens do commit passam. Um
    # PR mesclado na preview chega la como PUSH, e sem a preview aqui esse push
    # nao teria checagem nenhuma - o deploy ficaria esperando para sempre.
    branches: [main, preview]
  # Sem filtro de alvo, de proposito. Enquanto era `branches: [main]`, todo PR
  # que nao apontasse para a main entrava com ZERO checagem — e ninguem via,
  # porque "nenhum check" e silencio, nao vermelho. O trabalho longo do projeto
  # acontece em branch de integracao (a loja-do-servidor recebeu dezenas de PRs
  # assim), e era justamente ali que a rede nao existia.
  #
  # Nao e lista de branches: uma lista volta a morder na proxima branch que
  # alguem criar, e quem a criar nao vai lembrar de vir aqui.
  pull_request:

permissions:
  contents: read

# One CI run per ref; cancel superseded runs to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt is authoritative (guidelines); .pb.go is generated and exempt.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '\.pb\.go$' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Race detector + coverage. Os testes de integracao ficam atras da etiqueta
      # `integration` (precisam de Postgres) e rodam no job `integration`.
      - name: Test
        run: go test -race -cover ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # only-new-issues: gate quality on new/changed code without blocking on the
      # pre-existing lint debt. Run `golangci-lint run` locally for the full set.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          only-new-issues: true

  govulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest

    # POR QUE ESTE JOB EXISTE, e vale a pena escrever porque ele custa minutos: os
    # testes de integracao deste repo NAO RODAVAM EM LUGAR NENHUM. O job de cima
    # nao passa `-tags=integration`, e rodar a suite na maquina de quem desenvolve
    # e caro demais para ser habito.
    #
    # O que ficava sem portao nao era periferia: era o escrow do mercado, a corrida
    # entre abrir a cobranca e fechar a barraca, a maquina de estados do reembolso
    # e a corrida das duas abas criando duas cobrancas na processadora. Tudo isso
    # tinha teste escrito, verde uma vez na maquina de alguem, e nunca mais.
    services:
      postgres:
        # A MESMA VERSAO do docker-compose, de proposito. Um teste que passa no 16
        # e falha no 17 e um dia perdido descobrindo que o portao nao media o que a
        # producao roda.
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: dev
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # COM `-race`, e agora com numero para justificar: a primeira rodada verde deste
      # job levou 535 s (8m55s). Dobrar isso cabe folgado nos 30 min de teto, e a
      # medicao era a unica coisa que faltava para decidir.
      #
      # E o `-race` vale mais AQUI do que no job de cima. O que so existe neste job e
      # concorrencia de verdade contra o Postgres: a corrida das duas abas criando o
      # Pix, a corrida entre abrir a cobranca e fechar a barraca. Sao testes que rodam
      # goroutines de proposito, e uma corrida de dados neles passaria despercebida
      # sem o detector — um teste de corrida que nao roda com -race prova menos do que
      # parece.
      #
      # `-p 1` porque os testes compartilham UM banco: em paralelo eles se atropelam
      # no reset de schema, e a falha que sai disso parece bug de produto.
      #
      # `-timeout 30m` explicito porque o padrao do Go e 10 min e a suite estoura.
      #
      # E SO OS PACOTES QUE PRECISAM DE BANCO, e nao `./...`. Isto aqui rodava a suite
      # INTEIRA, os mesmos pacotes que o job "Build & Test" ja roda com -race no mesmo
      # commit — 83 pacotes duas vezes, entre eles o tmserver/internal/handler, que
      # sozinho leva 372 s e nao chega perto de um banco. Medido em 24/09/2026: o job
      # levava 796 s, dos quais 152 s eram os 6 pacotes de banco.
      #
      # O relogio da CI quase nao muda com isso (passa a ser o Build & Test, 755 s, que
      # manda), e nao e por relogio que se faz: e porque rodar de novo SO este job,
      # quando uma instabilidade obriga, cai de 13 min para uns 6 — e esse e o tempo em
      # que alguem fica parado esperando para mergear.
      #
      # A lista sai de um script que a DERIVA do codigo, nunca escrita a mao: ver
      # scripts/pacotes-de-teste.sh e o passo de conferencia logo abaixo.
      - name: Quais pacotes precisam de banco?
        run: |
          set -o pipefail
          ./scripts/pacotes-de-teste.sh conferir
          ./scripts/pacotes-de-teste.sh com-banco | tee pacotes-com-banco.txt

      - name: Integration tests
        env:
          W2PP_TEST_DSN: postgres://postgres:dev@localhost:5432/postgres
        run: |
          set -o pipefail
          go test -tags=integration -race -p 1 -timeout 30m -v $(cat pacotes-com-banco.txt) 2>&1 | tee integration.log

      # A GUARDA CONTRA O PIOR RESULTADO POSSIVEL: um job VERDE que nao rodou nada.
      #
      # Os testes fazem `t.Skip("W2PP_TEST_DSN not set")` quando a variavel falta. Se
      # alguem errar o nome dela, mudar a porta, ou o servico do Postgres nao subir,
      # os 269 testes PULAM e o job passa. Silencio fica identico a sucesso, e o
      # portao vira enfeite sem ninguem notar.
      #
      # Roda sempre (`if: always()`) para tambem falar quando o passo de cima falhou.
      - name: O portao rodou de verdade?
        if: always()
        run: |
          # O LOG TEM DE EXISTIR, e esta e a primeira coisa conferida porque a
          # propria guarda ja passou verde sem ele. Quando o passo dos testes nem
          # chega a rodar — foi o que aconteceu em 24/09/2026, com um passo novo
          # falhando antes —, o arquivo nao existe, o `grep` devolve vazio, e
          # `[ "" -eq 0 ]` e um ERRO de sintaxe do teste. Dentro de um `if`, o
          # `set -e` nao dispara: o erro e lido como "condicao falsa", e a guarda
          # segue em frente dizendo que esta tudo bem.
          #
          # Ou seja: a guarda contra o silencio tinha um silencio dentro dela.
          if [ ! -f integration.log ]; then
            echo "::error::integration.log nao existe: o passo dos testes nao chegou a rodar"
            exit 1
          fi

          # E agora ela pega uma coisa a mais: com o job rodando so os pacotes
          # escolhidos, um pulo por falta de DSN significa que algum deles chegou
          # aqui sem banco — ou que a separacao mandou para ca quem nao devia.
          pularam="$(grep -c 'W2PP_TEST_DSN not set' integration.log || true)"
          passaram="$(grep -c -- '--- PASS' integration.log || true)"
          # Contagem vazia vira zero AQUI, para nenhuma comparacao abaixo poder
          # errar em silencio pelo mesmo motivo.
          pularam="${pularam:-0}"
          passaram="${passaram:-0}"
          echo "passaram=$passaram  pularam-por-falta-de-banco=$pularam"
          if [ "$pularam" -gt 0 ]; then
            echo "::error::$pularam teste(s) pularam por falta de W2PP_TEST_DSN: o banco nao chegou ate eles"
            exit 1
          fi
          if [ "$passaram" -eq 0 ]; then
            echo "::error::nenhum teste passou; a suite de integracao nao rodou"
            exit 1
          fi

      # O log inteiro fica anexado, e nao so o rabo que o console mostra. Com 269
      # testes, a falha que interessa costuma estar longe do fim.
      - name: Guardar o log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-log
          path: integration.log
          retention-days: 7

  docker:
    name: Docker build (${{ matrix.svc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc: [tmserver, dbserver, binserver, webserver, adminserver]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the production image the same way Railway does (parameterized by
      # SVC); catches Dockerfile/.dockerignore regressions — e.g. the Release/
      # content tree tmserver bakes in. No push: this is a build smoke test.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SVC=${{ matrix.svc }}
          push: false
          tags: w2pp-${{ matrix.svc }}:ci
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}
