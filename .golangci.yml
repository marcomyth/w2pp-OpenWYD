# golangci-lint v2 config (guidelines §25). The v2 default set already enables
# errcheck/govet/ineffassign/staticcheck/unused; we add revive/misspell/unconvert
# on top and run gofmt/goimports as formatters. CI gates only *new* issues
# (only-new-issues) so pre-existing debt doesn't block; run `golangci-lint run`
# locally for the full picture. Regenerate via `golangci-lint migrate` if bumping.
version: "2"
linters:
  enable:
    - misspell
    - revive
    - unconvert
  settings:
    misspell:
      ignore-rules:
        # The legacy protocol really spells it this way (_MSG_Challange.cpp);
        # handlers/comments mirror that name for parity.
        - challange
        # The legacy GM tool file is genuinely named "Comandos GM.txt" (Portuguese
        # for "commands"), cited verbatim as an evidence source. The singular
        # appears the same way, in player-facing text and in comments quoting it
        # ("Cheque sua quantidade de entradas com o comando /nt").
        - comandos
        - comando
        # Portuguese for "decorative", describing the town actors the NPC panel
        # classifies. misspell reads it as a typo for "decoration".
        - decorativo
        # Portuguese for "monsters", in player-facing game text and in the admin
        # panel's routes. misspell reads it as a typo for "monstrous"; this is a
        # Portuguese-language server and the word is correct as written.
        - monstros
        # Portuguese for "gave" (past tense of "dar"), in a test failure message.
        # misspell reads it as a typo for "dram". Same class as the entries above:
        # the panel and its tests are written in Portuguese for the people who
        # operate this server, and misspell has no Portuguese dictionary to check
        # against — so ordinary words keep colliding with English ones.
        - deram
        # Portuguese for "progress", in a test message about a player losing
        # theirs. misspell reads it as a typo for "progression".
        - progresso
        # Portuguese for "secret", as in the Pedras Secretas the King fuses into
        # the Pedra Ideal. misspell reads it as a typo for "secrets"; the item
        # names are cited verbatim from the shipped catalog.
        - secretas
        # Portuguese for "planets" -- Netuno, Urano, Venus and the other planet
        # accessories (762-768) of the accessory reform. misspell reads it as a
        # typo for "planets"; it is the name the players and the staff use.
        - planetas
        # Portuguese for "moment", inside a refusal copied verbatim from
        # Language.txt. misspell reads it as a typo for "memento".
        - momento
        # Portuguese for "regardless", inside the Acelerador de Nascimento
        # tooltip quoted verbatim from the shipped client ("Aumenta o valor da
        # refinação em +1 independente da previsão do nascimento da montaria").
        # misspell reads it as a typo for "independence". It is here rather than
        # left alone because only-new-issues already let it through once: the
        # words stay, unreported, until somebody edits those lines and the
        # failure lands on them instead of on whoever wrote it.
        - independente
        # Portuguese for "they", in a comment on the training-field Ajudante
        # (ajudante.go). misspell reads it as a typo for "eels"; it is the most
        # common pronoun in the language, so it will keep coming back.
        #
        # E voltou: o teste dos pontos de lojinha trouxe a mesma palavra e a main
        # a acrescentou uma segunda vez. A entrada duplicada saiu na junção — uma
        # linha aqui já cobre o idioma inteiro, não um arquivo de cada vez.
        - eles
        # Portuguese for "criticals", as in the critical hits of the TK Espada
        # Mágica and of the mage trees. misspell reads it as a typo for "critics".
        - criticos
        # Portuguese for "variants", as in the two catalog variants of the kit
        # the /novato command hands out (5760/5761) — the word names the thing in
        # the migration, the handler and the client generator alike. misspell
        # reads it as a typo for "variants".
        - variantes
        # Portuguese for "to calculate", the verb in comments that explain a
        # formula (the guild-buff scaling, the skill damage pass). misspell reads
        # it as a typo for "calculator".
        - calcular
        # Portuguese for "author", the column and the field that record WHO made
        # a guild-buff change, in the panel and in the audit row. misspell reads
        # it as a typo for "author" — which is the English word for the same
        # thing, and exactly why the collision keeps happening.
        - autor
        # Portuguese for "transfers" (third person of "transferir"), the name of
        # the call that moves Cash or RMT between two accounts
        # (store.TransferePlayerBalance, handler.SaldoDeConta.Transfere).
        # misspell reads it as a typo for "transferred". Renaming it to English
        # would be renaming an identifier to satisfy an English dictionary, which
        # is not a reason to rename anything in a Portuguese codebase.
        - transfere
        # Portuguese for "expiry date", as in the validity of a guild buff.
        # misspell reads it as a typo for "validated".
        - validade
        # Portuguese for "simultaneous", in the comment that bounds how many
        # Honor Store windows a session may hold open at once. misspell reads it
        # as a typo for "simultaneous"; the accented spelling is "simultâneos"
        # and the comment drops the accent, as the rest of the file does.
        - simultaneos
        # Portuguese for "definitive": the real catalog index of a supporter
        # chest, as opposed to the borrowed one the in-game test runs on.
        # misspell reads it as a typo for "definition", plural included.
        - definitivo
        - definitivos
        # Portuguese for "denominator" — the scale a chest table is written
        # against (10,000 hundredths of a percent). misspell reads the
        # Portuguese word as a typo for the English one it translates.
        - denominador
        # Portuguese for "conditional", describing the three teleport routes that
        # carry a condition and therefore live in the handler instead of the
        # lookup table (vale.go, kefra.go, kefra_hall.go). misspell reads the
        # Portuguese word as a typo for the English one it translates.
        - condicional
        - condicionais
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
          - staticcheck
        path: \.pb\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
