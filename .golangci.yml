# golangci-lint v2 config (guidelines §25). The v2 default set already enables
# errcheck/govet/ineffassign/staticcheck/unused; we add revive/misspell/unconvert
# on top and run gofmt/goimports as formatters. CI gates only *new* issues
# (only-new-issues) so pre-existing debt doesn't block; run `golangci-lint run`
# locally for the full picture. Regenerate via `golangci-lint migrate` if bumping.
version: "2"
linters:
  enable:
    - misspell
    - revive
    - unconvert
  settings:
    misspell:
      ignore-rules:
        # The legacy protocol really spells it this way (_MSG_Challange.cpp);
        # handlers/comments mirror that name for parity.
        - challange
        # The legacy GM tool file is genuinely named "Comandos GM.txt" (Portuguese
        # for "commands"), cited verbatim as an evidence source. The singular
        # appears the same way, in player-facing text and in comments quoting it
        # ("Cheque sua quantidade de entradas com o comando /nt").
        - comandos
        - comando
        # Portuguese for "decorative", describing the town actors the NPC panel
        # classifies. misspell reads it as a typo for "decoration".
        - decorativo
        # Portuguese for "monsters", in player-facing game text and in the admin
        # panel's routes. misspell reads it as a typo for "monstrous"; this is a
        # Portuguese-language server and the word is correct as written.
        - monstros
        # Portuguese for "gave" (past tense of "dar"), in a test failure message.
        # misspell reads it as a typo for "dram". Same class as the entries above:
        # the panel and its tests are written in Portuguese for the people who
        # operate this server, and misspell has no Portuguese dictionary to check
        # against — so ordinary words keep colliding with English ones.
        - deram
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
          - staticcheck
        path: \.pb\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
