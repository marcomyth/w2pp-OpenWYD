# golangci-lint v2 config (guidelines §25). The v2 default set already enables
# errcheck/govet/ineffassign/staticcheck/unused; we add revive/unconvert
# on top and run gofmt/goimports as formatters. CI gates only *new* issues
# (only-new-issues) so pre-existing debt doesn't block; run `golangci-lint run`
# locally for the full picture. Regenerate via `golangci-lint migrate` if bumping.
#
# O MISSPELL SAIU DAQUI EM 23/09/2026, e o número está escrito para quem pensar
# em religá-lo.
#
# Ele é um verificador de ortografia INGLESA, e este repositório é escrito em
# PORTUGUÊS — comentários, mensagens ao jogador, nomes de identificador, tudo.
# Isso não é uma incompatibilidade ocasional, é estrutural: ele não tem
# dicionário de português, então palavra portuguesa certa colide com palavra
# inglesa parecida para sempre.
#
# A MEDIÇÃO, feita com a lista de ignorar esvaziada, sobre o repositório inteiro:
#
#   326 apontamentos, em 34 grafias distintas.
#   34 das 34 estavam CERTAS.
#
# As campeãs: monstros (116), comando (42), eles (27), autor (13), criticos (10),
# comandos (10), variantes (9), secretas (8), planetas (8), momento (7),
# transfere (5+4), progresso (4), denominador (4), condicional (4), calcular (4).
# A única não-portuguesa é `challange`, que é o nome literal do arquivo do legado
# (_MSG_Challange.cpp) e está certa por paridade — também não era erro a corrigir.
#
# DO OUTRO LADO, ZERO. Uma varredura do histórico inteiro atrás de 33 grafias
# inglesas erradas comuns (recieve, seperate, occured, neccessary, lenght, wich,
# untill e outras) não achou um único commit que tenha corrigido grafia. Os dois
# casos que apareceram eram falso-alarme da própria busca: `successfull` casando
# dentro de "successfully" e `recomend` dentro de "recomendados".
#
# O CUSTO, esse sim contado: a lista de ignorar chegou a 26 palavras, acrescentadas
# em 18 commits diferentes. Dezoito vezes alguém parou o que estava fazendo para
# ensinar português a um dicionário de inglês. A última custou TRÊS DIAS de um PR
# útil parado, por causa de `clientes` num comentário.
#
# E o `only-new-issues` piora em vez de aliviar: o falso positivo fica escondido
# até alguém EDITAR aquela linha, e aí a falha cai em quem passou perto e não em
# quem escreveu. Foi o que aconteceu com `independente`.
#
# A RESSALVA HONESTA, para a decisão poder ser revista com o que ela teve pela
# frente: ausência de correção no histórico não prova que ele nunca evitou um erro
# antes do commit — isso não deixa rastro. O que dava para medir foi medido, e o
# custo é visível e recorrente enquanto o benefício não tem uma única evidência.
#
# PARA RELIGAR: `golangci-lint run -c` com um arquivo que habilite só o misspell e
# nenhuma regra de ignorar reproduz a medição em um comando. Se o número tiver
# mudado, a decisão muda com ele.
version: "2"
linters:
  enable:
    - revive
    - unconvert
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
          - staticcheck
        path: \.pb\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
