<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Painel OpenWYD</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: #f4f5f2; --surface: #fff; --ink: #15181a; --ink-2: #555f63;
    --rule: #d8dcd6; --accent: #1f6f5c; --danger: #9a2b23; --danger-bg: #f7e8e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #131719; --surface: #1a1f21; --ink: #e7eae5; --ink-2: #a0aaad;
      --rule: #2b3235; --accent: #56ac90; --danger: #e08b83; --danger-bg: #2e1c1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--ground); color: var(--ink); padding: 24px;
    font: 15px/1.55 ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  }
  main {
    width: 100%; max-width: 380px; background: var(--surface);
    border: 1px solid var(--rule); border-radius: 4px; padding: 32px 28px;
  }
  h1 { margin: 0 0 4px; font-size: 1.25rem; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 24px; color: var(--ink-2); font-size: 13.5px; }
  label { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
          color: var(--ink-2); margin-bottom: 6px; }
  input {
    width: 100%; padding: 9px 11px; margin-bottom: 18px; font: inherit;
    color: var(--ink); background: var(--ground);
    border: 1px solid var(--rule); border-radius: 3px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  button {
    width: 100%; padding: 10px; font: inherit; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--accent); border: none; border-radius: 3px;
  }
  button:hover { filter: brightness(1.08); }
  .erro {
    background: var(--danger-bg); color: var(--danger); border: 1px solid currentColor;
    border-radius: 3px; padding: 10px 12px; margin-bottom: 20px; font-size: 13.5px;
  }
</style>
</head>
<body>
  <main>
    <h1>Painel administrativo</h1>
    <p class="sub">Acesso restrito à equipe do servidor.</p>

    {{if .Error}}<div class="erro">{{.Error}}</div>{{end}}

    <form method="post" action="/login">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" autocomplete="username" autocapitalize="off"
             spellcheck="false" required autofocus>

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>

      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
